title: "Deep review round 2: joint re-review of error_class exposure, /goal restoration, and remediation wave"
mode: deep
admission:
  brief_revision: 1
  qa_mode: LIGHT
  verdict: READY
  brief:
    goal: "Jointly re-review the entire uncommitted working-tree diff: (1) DAG error_class exposure + wake attribution + failure-triage guidance, (2) /goal feature restoration, (3) the remediation wave that fixed round-1 findings — including cross-bundle consistency"
    scope:
      in:
        - "git diff HEAD across packages/core (dag persistence, goal sql, migrations, workflow.md, dag-flow.txt, schema/migration registries)"
        - "packages/opencode (goal module restore, session/prompt/system/command wiring, tool registry, dag runtime loop.ts, httpapi groups/handlers, tests)"
        - "packages/plugin + packages/tui (goal sidebar, sync slice, adapters, builtins)"
        - "packages/sdk/js regenerated surface (goal + error_class fields)"
        - "cross-bundle consistency: guidance docs vs runtime semantics, schema vs SDK vs httpapi, test coverage of all new behavior"
      out:
        - "committed baseline behavior unchanged by the diff"
        - "untracked .opencode/workflows/*.yaml experiment files and .opencode/.dag-specs/ artifacts"
    constraints:
      - "reviewers are read-only; do not modify any file"
      - "every material finding must cite file:line evidence"
    assumptions:
      - "the working tree diff against HEAD is the complete review target"
      - "migration/baseline/registry files were generated by bun script/migration.ts; SDK gen files were generated by packages/sdk/js/script/build.ts"
      - "intentional adaptations to accept, not flag: goal restoration without the migration-window /goal deprecation scaffolding; IF NOT EXISTS hardening in restore_goal_state migration; serviceOption/deferred-resolution layer patterns introduced after goal retirement; Pick<Goal,...> in plugin/tui.ts"
    acceptance_criteria:
      - "no unresolved CRITICAL/HIGH finding on verified evidence"
      - "error_class value set consistent end-to-end; wake attribution and status surfaces correct"
      - "workflow.md/dag-flow.txt guidance matches actual runtime semantics after the remediation wave"
      - "goal restoration functionally complete vs pre-retire baseline (state management, tool registration, dispatch, judge loop, TUI, HTTP API)"
      - "regenerated SDK diff limited to intended additions; repo contract obligations satisfied"
    evidence_required:
      - "file:line citations for static claims"
      - "executed test-suite, typecheck, migration-check, and httpapi contract results"
    risks:
      - "cross-bundle interference (goal wiring vs dag changes in shared files: app-runtime, bootstrap, registry, prompt.ts, httpapi session group)"
      - "guidance docs drifting from runtime semantics again after remediation edits"
      - "layer-wiring regressions from restoring heavyweight GoalLoop into bootstrap/app layers"
    review_plan:
      - "wave 1: consolidated diff scope map with per-bundle change inventory + reference manifest"
      - "wave 2: six parallel dimension reviewers"
      - "wave 3: claim verification + objective gate execution"
      - "wave 4: advanced-tier arbiter (PASS/LOOP/BLOCKED) with bounded-loop continuation"
    open_questions: []
    blocking_questions: []
config:
  name: deep-review-round2
  max_concurrency: 8
  max_node_replan_attempts: 3
  max_total_nodes: 20
  node_defaults:
    required: false
    report_to_parent: false
    worker_config:
      timeout_ms: 900000
  nodes:
    - id: scope-diff
      name: "Scope: consolidated diff map + manifest"
      worker_type: explore
      depends_on: []
      required: true
      prompt_template:
        inline: |
          You are the SCOPE MAPPER for a joint deep review of the uncommitted
          working-tree diff in this repository. Read-only — do not modify any file.

          Run `git diff HEAD --stat`, `git diff HEAD` per area, and
          `git status --short` (untracked files included) and produce:

          1. Consolidated change map grouping EVERY changed/new file into one of
             these bundles (flag any file fitting none as AUDIT-FLAG):
             - BUNDLE A (error_class exposure + wake attribution): core/src/dag/{sql,store,projector}.ts, migrations 20260803073521_*, tool/workflow.ts status, dag/runtime/loop.ts wake digest, httpapi dag group/handler, sdk DagNode.error_class, related tests
             - BUNDLE B (/goal restoration): core/src/goal/sql.ts + migration 20260803083938_*, opencode/src/goal/*, session/prompt/goal.txt, tool/goal.{ts,txt}, command/index.ts GOAL/SUBGOAL, session/{prompt,session,system}.ts wiring, effect/{app-runtime,bootstrap-runtime}.ts + project/bootstrap.ts GoalLoop wiring, tool/registry.ts, httpapi session goal route + handler + server Goal.node, plugin/tui.ts goal types, tui sidebar/goal.tsx + sync + builtins + adapters, test fixture/goal tests/httpapi-exercise goal scenario, sdk Goal surface
             - BUNDLE C (remediation wave from prior review): core/src/plugin/command/workflow.md triage section rewrite, dag-flow.txt triage sentence, loop.ts catchCause/store/predicate fixes, new test assertions (cancelled-errorClass-null, recovery errorClass), packages/sdk/js/.gitignore
             - GENERATED: schema.json, migration.gen.ts, schema.gen.ts, sdk gen files (verify they contain ONLY goal + error_class related additions)
          2. For each bundle, the stated intent (A: persist/expose node failure
             class so the parent agent repairs failed nodes instead of restarting;
             B: restore the retired /goal feature faithfully incl. state management
             (goal_state table, goal.updated/cleared events) and tool registration
             (GoalTool status/complete); C: fix guidance-doc defects found by the
             prior review's arbiter).
          3. Verify and emit the reference manifest:
             - reference_template: deep-review-dag-module
             - added nodes: scope-diff, review-error-class, review-guidance, review-goal-core, review-goal-surface, review-tests, review-style, verify-suite
             - pruned lanes: explore-core, explore-runtime, explore-templates, explore-integrations — prune_reason: target is a bounded working-tree diff, not the whole module; replacement_coverage: this scope-diff consolidated change map feeds every reviewer lane
          4. List every changed file once, with bundle tag; AUDIT-FLAG anything unclassifiable.

          Downstream reviewers receive this map as context.

    - id: review-error-class
      name: "Review: error_class dataflow + wake semantics"
      worker_type: general
      depends_on: [scope-diff]
      prompt_template:
        inline: |
          You are a DATAFLOW & RUNTIME REVIEWER. Read-only — do not modify any file.
          Review target: BUNDLE A + its BUNDLE C remediation hunks in the
          uncommitted diff (`git diff HEAD`), per the upstream scope map.

          Criteria:
          - error_class end-to-end: schema trigger literals -> projector -> store ->
            status tool output -> wake node-line suffix -> wake failed-workflow digest
            -> httpapi NodeResponse -> SDK DagNode. Same vocabulary everywhere.
          - loop.ts wake digest after remediation: bound `store.getNodes`,
            Effect.catchCause + logWarning fallback, type-predicate filter; verify no
            lock/ordering hazards vs wake_reported persistence and no behavior
            regression for completed/cancelled workflows (old terminal line intact).
          - Double reporting (failed node in both node line and workflow digest):
            acceptable or harmful for parent triage?
          - Truncation (300/500 slices), digest size for many failed nodes.
          - push_exhausted: reserved, never produced — confirm no producer exists and
            surfaces handle its absence.
          - Test pins: cancelled-node errorClass-null assertion, wake digest
            attribution test, recovery errorClass assertions — adequate?

          MANDATORY output format:
          1. findings: array of {severity: CRITICAL|HIGH|MEDIUM|LOW, title, description, evidence: "file:line", recommendation}
          2. unverified_claims: array of strings
          3. summary: 2-3 sentences

    - id: review-guidance
      name: "Review: guidance docs vs runtime semantics"
      worker_type: general
      depends_on: [scope-diff]
      prompt_template:
        inline: |
          You are a PROMPT-ACCURACY REVIEWER. Read-only — do not modify any file.
          Review target: BUNDLE C guidance hunks — packages/core/src/plugin/command/
          workflow.md "Node failure triage" section (rewritten in the remediation
          wave) + dag-flow.txt triage sentence + Budget Declaration wording —
          checked against ACTUAL runtime behavior. These prompts steer parent-agent
          repair decisions; any semantic drift is a bug.

          Verify every factual claim against code:
          - timeout row: runtime cancels child session at deadline (spawn.ts);
            partial-artifact advice accurate.
          - exec_failed row (a)(b)(c) gating: do the cited reason strings/classes
            exist exactly as written (recovery.ts, dag.ts terminateNonTerminalNodes
            failReason propagation `required node(s) failed: ...`, loop.ts
            orchestrator_unresponsive, template/condition errors)? Is the
            per-reason response correct?
          - verdict_fail row two shapes: ran-but-broke-contract vs never-ran pre-spawn
            (unresolved placeholders loop.ts, review input contract) — confirm both
            paths and that the fixes advised actually address them.
          - cascade detection two shapes: required-failure leaves dependents pending
            (check scheduler/transitions: do dependents stay pending or become
            skipped?); optional-failure interpolation text `Dependency "X" failed:`
            lands in dependent PROMPT text not error_reason (loop.ts resolveInputMapping).
          - Qualifier "Every node failed via dag.node.failed carries an error_class"
            + replan-cancel exception (projector NodeCancelled keeps error_class
            null) — accurate?
          - Value-set sentence (push_exhausted reserved) — matches schema + producers?
          - Budget Declaration paragraph (defaults are floors; verifier/aggregator
            lanes need 20-30min) — consistent with node_defaults usage elsewhere?
          - Cross-doc consistency: Crash recovery / Escalation / Verdict Disposal
            Contract / Bounded Repair / Resume-first — any contradiction?

          MANDATORY output format:
          1. findings: array of {severity: CRITICAL|HIGH|MEDIUM|LOW, title, description, evidence: "file:line", recommendation}
          2. unverified_claims: array of strings
          3. summary: 2-3 sentences

    - id: review-goal-core
      name: "Review: goal state management + loop correctness"
      worker_type: general
      depends_on: [scope-diff]
      prompt_template:
        inline: |
          You are a CORE-CORRECTNESS REVIEWER for the restored /goal feature.
          Read-only — do not modify any file. Review target: BUNDLE B core hunks:
          packages/opencode/src/goal/* (goal.ts state service, state.ts, events.ts,
          judge.ts, loop.ts GoalLoop, prompts.ts), core/src/goal/sql.ts + restore
          migration, session/{prompt,session,system}.ts wiring, effect layer wiring
          (app-runtime, bootstrap-runtime, project/bootstrap), tool/{registry,goal}.ts.

          Criteria:
          - Goal state service: load/set/pause/resume/clear/markDone/subgoals
            correctness; DB row shape vs GoalStateTable; event emission matches
            schema SessionGoal.Definitions (goal.updated/goal.cleared) with correct
            payload mapping.
          - GoalLoop: idle-event subscription lifecycle (init via serviceOption in
            bootstrap), continuation prompt flow, judge transport failure budget,
            kick dispatch, turn budget/pause semantics; fiber cleanup on session end
            (session.ts clear on remove).
          - Layer wiring: Goal.defaultLayer placement (mergeAll group1),
            GoalLoop.defaultLayer via provideMerge with self-provided deps (loop.ts
            defaultLayer) — verify self-containment and memoMap dedup claims;
            BootstrapLayer inclusion consistency with the bootstrap.ts lazy comment.
          - prompt.ts dispatch: ordering (early return before commands.get), error
            branch, announce/kick handling, startContext drain; no leftover
            deprecation scaffolding.
          - system.ts goal injection: degradation note vs active goal block; prompt
            bloat behavior.
          - Migration IF NOT EXISTS correctness for upgrade/fresh-DB paths.
          - Compatibility with post-retire architecture (V2 session paths, hook
            deferred-import cycle discipline).

          MANDATORY output format:
          1. findings: array of {severity: CRITICAL|HIGH|MEDIUM|LOW, title, description, evidence: "file:line", recommendation}
          2. unverified_claims: array of strings
          3. summary: 2-3 sentences

    - id: review-goal-surface
      name: "Review: goal HTTP/SDK/TUI surface"
      worker_type: general
      depends_on: [scope-diff]
      prompt_template:
        inline: |
          You are an API/UI-SURFACE REVIEWER for the restored /goal feature.
          Read-only — do not modify any file. Review target: BUNDLE B surface hunks:
          httpapi groups/session.ts goal endpoint + handlers/session.ts goal handler
          + server.ts Goal.node, packages/sdk/js gen additions (Goal type +
          session.goal method), packages/plugin/src/tui.ts TuiSidebarGoalItem
          (Pick<Goal,...>) + TuiState.goal, packages/tui sidebar/goal.tsx +
          sync.tsx goal slice/reducer/hydration + builtins + adapters, command/index.ts
          GOAL/SUBGOAL entries, httpapi-exercise goal scenario + runner/runtime/types.

          Criteria:
          - Schema vs handler vs SDK alignment for session.goal (optionality, field
            names goal/status/turnsUsed/maxTurns/subgoals/pausedReason).
          - TUI: sync reducer cases for goal.updated/goal.cleared; hydration fetch
            with catch fallback; adapters Number() coercion vs SDK JSON-Schema number
            union; builtins registration order; sidebar widget renders only when goal
            present.
          - plugin tui.ts Pick<Goal,...> — does the adapter still satisfy the type
            (finite numbers assignable)?
          - Exercise scenario assertions match handler behavior; runner goal helper +
            runtime Goal module wiring (service resolvable at runtime — flag if the
            scenario layer lacks Goal provision).
          - Command entries: descriptions accurate, dispatch handled in prompt.ts
            (template "" never reaches LLM path).
          - SDK gen delta limited to goal additions (no unrelated drift).

          MANDATORY output format:
          1. findings: array of {severity: CRITICAL|HIGH|MEDIUM|LOW, title, description, evidence: "file:line", recommendation}
          2. unverified_claims: array of strings
          3. summary: 2-3 sentences

    - id: review-tests
      name: "Review: test coverage across all bundles"
      worker_type: general
      depends_on: [scope-diff]
      prompt_template:
        inline: |
          You are a TEST-COVERAGE REVIEWER. Read-only — do not modify any file.
          Review target: all test hunks in the uncommitted diff across BUNDLES A/B/C:
          test/dag/{fixtures.ts,workflow-tool.test.ts,dag-wake-integration.test.ts,
          dag-replan-stale-nodefailed.test.ts,dag-loop-recovery-integration.test.ts},
          test/goal/*, test/tool/goal-tool.test.ts, test/event-manifest.test.ts,
          test/fixture/tui-plugin.ts, test/server/httpapi-exercise/*.

          Criteria:
          - Bundle A pins: projector persistence, status output, wake digest
            attribution (exact strings), cancelled-null invariant, recovery classes —
            adequate and non-brittle?
          - Bundle B: restored suites cover state service, judge parse/budget,
            loop lifecycle (continue/done, dispatch-failure pause/resume), tool
            status/complete; what CURRENT-architecture risks are untested (e.g.
            /goal dispatch ordering vs /trust, bootstrap serviceOption absence path,
            TUI reducer)?
          - Bundle C: cancelled-null pin placement correct; recovery errorClass pin;
            guidance-doc behavior has no executable guard (expected — note only).
          - Hygiene: no duplicated logic into tests, mocks realistic, fixtures
            representative, no tests asserting on unreachable states.
          - Cross-bundle: any shared fixture change (fixtures.ts errorClass) breaking
            other suites?

          MANDATORY output format:
          1. findings: array of {severity: CRITICAL|HIGH|MEDIUM|LOW, title, description, evidence: "file:line or test path", recommendation}
          2. unverified_claims: array of strings
          3. coverage_gaps: array of {path, untested_scenarios: string[]}
          4. summary: 2-3 sentences

    - id: review-style
      name: "Review: style & repo conventions"
      worker_type: general
      depends_on: [scope-diff]
      prompt_template:
        inline: |
          You are a STYLE & CONVENTIONS REVIEWER. Read-only — do not modify any file.
          Review target: ALL uncommitted code hunks across BUNDLES A/B/C
          (`git diff HEAD` + new files).

          Review against root AGENTS.md Style Guide and package AGENTS.md files:
          - Comments: only non-obvious constraints; judge every new/changed comment.
          - const over let, no else, no unnecessary destructuring, no import aliases,
            functional style; Effect conventions (Effect.fn naming, catchCause vs
            catch, no nested service yields).
          - Layer invariants: self-contained defaultLayers, provideMerge placements,
            LayerNode .node lists complete for every consumer of Goal/GoalLoop.
          - Migrations: naming, id format, drizzle snake_case, registry freshness.
          - Docs: workflow.md section placement/heading consistency, table
            formatting; dag-flow.txt sentence integration; budget paragraph wording.
          - Module shape: restored goal files put self-reexport at file top vs repo
            convention (bottom) — flag with severity per repo rule, noting these are
            faithful pre-retire restorations.
          - httpapi: declared errors present, optional fields declared iff emitted.

          MANDATORY output format:
          1. findings: array of {severity: CRITICAL|HIGH|MEDIUM|LOW, title, description, evidence: "file:line", recommendation}
          2. unverified_claims: array of strings
          3. summary: 2-3 sentences

    - id: verify-claims
      name: "Verify Disputed Claims"
      worker_type: general
      depends_on: [review-error-class, review-guidance, review-goal-core, review-goal-surface, review-tests, review-style]
      required: true
      worker_config:
        timeout_ms: 1800000
      output_schema:
        type: object
        required: [verdict, verified_claims, disputed_findings_resolution, critical_findings_status, coverage_gaps, evidence_quality, prune_audit]
        properties:
          verdict:
            type: string
            enum: [VERIFIED, GAPS, BLOCKED]
          verified_claims: { type: array, items: { type: object } }
          disputed_findings_resolution: { type: array, items: { type: object } }
          critical_findings_status: { type: array, items: { type: object } }
          coverage_gaps: { type: array, items: { type: object } }
          evidence_quality: { type: string }
          prune_audit: { type: array, items: { type: object } }
      prompt_template:
        inline: |
          You are a CLAIM VERIFIER. Read-only — do not modify any file.

          Six reviewers produced findings and unverified_claims about the uncommitted
          diff. You are the fresh-context verification wave. Check every
          unverified/disputed/CRITICAL/HIGH claim against the actual code; sample
          MEDIUM/LOW claims instead of trusting self-report.

          Upstream context contains all 6 reviewer outputs + the scope map. Extract:
          1. All unverified_claims items
          2. Findings where reviewers disagree (especially cross-bundle claims about
             shared files: app-runtime, bootstrap, prompt.ts, registry, httpapi session group)
          3. All CRITICAL/HIGH findings (must be verified regardless)
          4. Every factual claim in review-guidance — these ALL need code confirmation
          5. Any diff area with no evidence-bearing reviewer output (AUDIT-FLAG files
             from the scope map must be resolved)

          For each claim, read the actual source at the cited location and determine
          CONFIRMED / REFUTED / PARTIALLY_CONFIRMED / UNRESOLVABLE with the exact line.
          Record prune_audit verdicts for the scope manifest.

          Verdict:
          - VERIFIED: every material scope/criterion covered, no material claim unresolved
          - GAPS: a bounded fresh review can close named gaps
          - BLOCKED: required evidence cannot be obtained

          Submit via submit_result. coverage_gaps must name the missing scope,
          evidence, and the smallest reviewer lane to add in a LOOP.

    - id: verify-suite
      name: "Verify: execute tests and gates"
      worker_type: general
      depends_on: [scope-diff]
      required: true
      output_schema:
        type: object
        required: [verdict, results, anomalies]
        properties:
          verdict:
            type: string
            enum: [PASS, FAIL, BLOCKED]
          results:
            type: array
            items:
              type: object
              required: [gate, command, outcome, detail]
              properties:
                gate: { type: string }
                command: { type: string }
                outcome: { type: string, enum: [PASS, FAIL, SKIPPED] }
                detail: { type: string }
          anomalies: { type: array, items: { type: string } }
      prompt_template:
        inline: |
          You are an OBJECTIVE GATE RUNNER. Execute commands and report faithfully.
          Do NOT modify any file. Do not fix failures — report them.

          Gates (each from the stated directory):
          1. typecheck core: bun run typecheck (packages/core)
          2. typecheck opencode: bun run typecheck (packages/opencode)
          3. opencode DAG suites: bun test test/dag (packages/opencode)
          4. goal suites: bun test test/goal test/tool/goal-tool.test.ts (packages/opencode)
          5. core DAG suites: bun test test/dag-core.test.ts test/dag-projector-drift.test.ts test/dag-store-summaries.test.ts test/plugin/command.test.ts (packages/core)
          6. migration check: bun script/migration.ts --check (packages/core)
          7. HttpAPI contract: bun run test:httpapi --fail-on-missing (packages/opencode)
          8. SDK freshness: in packages/sdk/js run bun run build, then
             `git diff -- packages/sdk/js/src/v2/gen`. Interpretation: this working
             tree intentionally adds (uncommitted) Goal types + session.goal method +
             DagNode.error_class — PASS iff the gen diff contains ONLY those intended
             additions and no other drift.

          Record outcome + decisive output fragment per gate. Verdict PASS only if all
          gates pass under that interpretation; FAIL lists each failing gate with
          evidence; BLOCKED states why a gate cannot run.

    - id: arbitrate
      name: "Arbiter: Final Verdict"
      worker_type: general
      depends_on: [verify-claims, verify-suite]
      required: true
      report_to_parent: true
      worker_config:
        timeout_ms: 1200000
      output_schema:
        type: object
        required: [verdict, reason, evidence, findings, loop_scope, stop_reason, next_action, prune_decisions]
        properties:
          verdict:
            type: string
            enum: [PASS, LOOP, BLOCKED]
          reason: { type: string }
          evidence:
            type: array
            items: { type: string }
          findings:
            type: array
            items:
              type: object
              required: [severity, title, evidence, status]
              properties:
                severity:
                  type: string
                  enum: [CRITICAL, HIGH, MEDIUM, LOW]
                title: { type: string }
                description: { type: string }
                evidence: { type: string }
                status:
                  type: string
                  enum: [CONFIRMED, REFUTED, PARTIALLY_CONFIRMED]
                recommendation: { type: string }
          loop_scope:
            type: array
            items: { type: string }
          stop_reason:
            type: string
            enum: [goal_met, correction_required, evidence_missing, no_progress, round_cap, budget_cap]
          next_action:
            type: string
            enum: [finalize, replan, stop]
          prune_decisions:
            type: array
            items:
              type: object
              required: [node, prune_reason, replacement_coverage]
              properties:
                node: { type: string }
                prune_reason: { type: string }
                replacement_coverage: { type: string }
      prompt_template:
        inline: |
          You are the ARBITER for this joint deep review of the uncommitted diff.
          You rule on VERIFIED evidence only. verify-claims + verify-suite outputs
          are your primary evidence base; the 6 reviewer outputs and the scope map
          are context.

          Your job:
          1. For each CONFIRMED finding, assess true severity
          2. Discard REFUTED claims; correct PARTIALLY_CONFIRMED descriptions
          3. Deduplicate findings sharing a root cause; rank by impact
          4. Weight guidance-doc inaccuracies as at least HIGH (they steer
             parent-agent repair decisions); any objective-gate failure at least HIGH
          5. Accept (do not penalize) the admission-listed intentional adaptations;
             resolve all AUDIT-FLAG files from the scope map
          6. Audit prune_decisions from the scope manifest (via prune_audit); missing
             prune_reason/replacement_coverage forbids PASS
          7. Verdict:
             - PASS: no unresolved material finding; scope and evidence coverage complete
             - LOOP: a bounded targeted review can resolve specific omissions/disputes
             - BLOCKED: evidence insufficient, critical contradiction unresolved, or ceiling reached
          8. LOOP names the minimal new scope in loop_scope; never rerun completed waves
          9. State reason, evidence, stop_reason, next_action explicitly

          Parent disposal contract: PASS -> finalize; LOOP -> pause/replan/resume
          fresh targeted nodes; BLOCKED -> stop. Submit via submit_result.

    - id: deep-dive
      name: "Plan the bounded fresh review loop"
      worker_type: general
      depends_on: [arbitrate]
      condition: 'arbitrate.output.verdict == "LOOP"'
      required: true
      report_to_parent: true
      prompt_template:
        inline: |
          The arbiter required LOOP. Produce a minimal replan fragment proposal for a
          NEW local review wave. Include only the missing or disputed scope from the
          arbiter's loop_scope, assign NEW node IDs, preserve real artifact
          dependencies, add a fresh verifier and a new arbiter, stay within caps.
          Read-only: do not fix code. Keep proposals compact and copy-paste-ready as a
          replan fragment — the parent applies it via pause/replan/resume.

          Return the loop reason, new nodes, dependencies, evidence each node must
          collect, acceptance condition, and stop reason.

    - id: finalize-review
      name: "Publish the accepted deep-review report"
      worker_type: general
      depends_on: [arbitrate]
      condition: 'arbitrate.output.verdict == "PASS"'
      required: true
      report_to_parent: true
      prompt_template:
        inline: |
          Publish the final evidence-backed joint review report for the uncommitted
          diff. Include: scope coverage per bundle (A error_class, B goal restoration,
          C remediation), confirmed findings (severity-ranked with file:line
          evidence), discarded/refuted claims, objective gate results, residual
          low-risk issues, and the final PASS reason. Do not introduce new findings
          or claims not verified upstream.
