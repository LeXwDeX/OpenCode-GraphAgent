title: "Deep Review: PR #167 dag-config-repo (continue from completed waves)"
mode: deep
admission:
  brief_revision: 1
  qa_mode: LIGHT
  verdict: READY
  brief:
    goal: "从已完成的探索(3)/审查(5)波续跑 PR #167 深度 review：仅执行声明验证 → 仲裁 → 续波，上游输出已落盘在 .opencode/.dag-specs/review-parts/"
    scope:
      in:
        - "verify-claims：对 .opencode/.dag-specs/review-parts/*.md 中的 8 份探索/审查输出做 fresh-context 声明验证（含 CRITICAL/HIGH、unverified_claims、争议、prune manifest、测试执行）"
        - "arbitrate：基于验证结果给出 PASS/LOOP/BLOCKED"
        - "continuation：deep-dive（LOOP 时）或 finalize-review（PASS 时）"
      out:
        - "重新运行探索/审查波（其结果已存在且被直接复用）"
    constraints:
      - "只读：不修改任何代码文件"
      - "verify 必须对照实际代码（file:line）检查声明，禁止基于审查者自报通过"
      - "上游报告文件只读，不改写"
    assumptions:
      - "8 份上游报告完整且可信（已提取自上一轮 workflow 的 completed 节点）"
      - "模型 400 为偶发，重试即可"
    acceptance_criteria:
      - "所有 material 声明被验证并给出 CONFIRMED/REFUTED/PARTIALLY_CONFIRMED/UNRESOLVABLE"
      - "无未解析的 CRITICAL/HIGH（除非证据确实无法获取且已指名）"
      - "仲裁给出结构化 PASS/LOOP/BLOCKED 判决"
      - "prune manifest 被审计"
    evidence_required:
      - "file:line 引用（verify 对照实际源码）"
      - "测试执行结果（bun test dag-workflows / workflow-tool）"
    risks:
      - "上游报告可能含审查者误读，verify 波必须独立对照源码"
      - "模型 400 偶发可能导致本节点再次失败"
    review_plan:
      - "verify-claims（读取 8 份落盘报告 + 对照源码验证）"
      - "arbitrate（PASS/LOOP/BLOCKED，report_to_parent）"
      - "continuation：LOOP → deep-dive 提案 replan；PASS → finalize-review 发布报告"
    open_questions: []
    blocking_questions: []
config:
  name: deep-review-pr167-continue
  max_concurrency: 2
  max_node_replan_attempts: 2
  max_total_nodes: 10
  node_defaults:
    required: false
    report_to_parent: false
    worker_config:
      timeout_ms: 900000
  nodes:
    # Continuation graph: explore(3) + review(5) were COMPLETED in workflow
    # dag_03996cfb; their outputs are on disk at .opencode/.dag-specs/review-parts/.
    # Wave 3: Claim Verification (reads the persisted upstream reports)
    - id: verify-claims
      name: "Verify Disputed Claims (from persisted reports)"
      worker_type: general
      depends_on: []
      required: true
      worker_config:
        timeout_ms: 1800000
      output_schema:
        type: object
        required: [verdict, verified_claims, disputed_findings_resolution, critical_findings_status, coverage_gaps, evidence_quality, prune_audit]
        properties:
          verdict:
            type: string
            enum: [VERIFIED, GAPS, BLOCKED]
          verified_claims: { type: array, items: { type: object } }
          disputed_findings_resolution: { type: array, items: { type: object } }
          critical_findings_status: { type: array, items: { type: object } }
          coverage_gaps: { type: array, items: { type: object } }
          evidence_quality: { type: string }
          prune_audit: { type: array, items: { type: object } }
      prompt_template:
        inline: |
          你是声明验证者（fresh-context）。只读，禁止修改任何文件。工作目录：本仓库。

          探索波（3 节点）与审查波（5 节点）已在上一轮 workflow 中完成，其报告已落盘，你必须先读取它们：
          - .opencode/.dag-specs/review-parts/explore-runtime.md（内置 scope 解析 + PRUNE MANIFEST）
          - .opencode/.dag-specs/review-parts/explore-build.md（构建注入 + 命令）
          - .opencode/.dag-specs/review-parts/explore-ci.md（release 流水线 + 测试）
          - .opencode/.dag-specs/review-parts/review-architecture.md
          - .opencode/.dag-specs/review-parts/review-logic.md
          - .opencode/.dag-specs/review-parts/review-style.md
          - .opencode/.dag-specs/review-parts/review-testability.md
          - .opencode/.dag-specs/review-parts/review-robustness.md

          审查目标仍是 git diff origin/dev...HEAD（PR #167，4 commits）。你负责对整个本地审查波的 fresh-context 复核。

          时间预算（30 分钟硬上限）：按下列优先级推进，不要在单个声明上耗尽预算：
          1. 所有 CRITICAL/HIGH —— 逐一对照 file:line 验证（各报告内已给出 evidence，务必读实际源码确认）
          2. 所有审查者 unverified_claims —— 对照实际代码验证
          3. 审查者之间冲突的 findings
          4. 抽样 3-5 条 MEDIUM/LOW 声明
          5. PRUNE MANIFEST 审计（来自 explore-runtime.md）
          6. 执行测试/类型检查证据：cd packages/opencode && bun test test/dag/dag-workflows.test.ts（应 14 pass）&& bun test test/dag/workflow-tool.test.ts（应 26 pass）&& bun run typecheck。
          若时间不足，以 GAPS 判决结束并指名未验证的剩余部分——不要含糊带过。

          特别留意审查波已经标注的候选阻塞项，逐一核实其真实性：
          - review-architecture：/dag-template-update 命令只注册了 core plugin draft 一处，未接入应用 Command 服务，运行时可能不可达
          - review-logic H1：Windows 发布构建 DAG_TEMPLATES_DIR 路径未做 cygpath 转换
          - review-logic H2 / review-testability：builtin scope 零测试覆盖，被删的仓库自检无替代
          对每条声明，读实际源码（file:line）判定：
          - CONFIRMED: 代码确如审查者所述（引用确切行）
          - REFUTED: 代码并非审查者所述（解释原因）
          - PARTIALLY_CONFIRMED: 方向正确但表述不精确
          - UNRESOLVABLE: 静态分析无法确定

          判决：
          - VERIFIED: 每个 material 范围/准则都被覆盖且无 material 声明悬而未决
          - GAPS: 有界的 fresh review 可关闭已命名的覆盖/证据缺口
          - BLOCKED: 无法获得所需证据或审查波不可审计

          通过 submit_result 提交结构化结果。coverage_gaps 必须命名缺失的范围、证据、以及 LOOP 时应新增的最小审查 lane。
    # ---- Wave 4: Arbitration ----
    - id: arbitrate
      name: "Arbiter: Final Verdict"
      worker_type: general
      depends_on: [verify-claims]
      required: true
      report_to_parent: true
      output_schema:
        type: object
        required: [verdict, reason, evidence, findings, loop_scope, stop_reason, next_action, prune_decisions]
        properties:
          verdict:
            type: string
            enum: [PASS, LOOP, BLOCKED]
          reason: { type: string }
          evidence:
            type: array
            items: { type: string }
          findings:
            type: array
            items:
              type: object
              required: [severity, title, evidence, status]
              properties:
                severity:
                  type: string
                  enum: [CRITICAL, HIGH, MEDIUM, LOW]
                title:
                  type: string
                description:
                  type: string
                evidence:
                  type: string
                status:
                  type: string
                  enum: [CONFIRMED, REFUTED, PARTIALLY_CONFIRMED]
                recommendation:
                  type: string
          loop_scope:
            type: array
            items:
              type: string
          stop_reason:
            type: string
            enum: [goal_met, correction_required, evidence_missing, no_progress, round_cap, budget_cap]
          next_action:
            type: string
            enum: [finalize, replan, stop]
          prune_decisions:
            type: array
            items:
              type: object
              required: [node, prune_reason, replacement_coverage]
              properties:
                node: { type: string }
                prune_reason: { type: string }
                replacement_coverage: { type: string }
      prompt_template:
        inline: |
          你是 PR #167 深度 review 的仲裁者。你只对已验证的证据下结论。

          验证波已检查所有 unverified/disputed 声明，其输出是你的主要证据基础（verify-claims 的 submit_result 输出）。5 个审查者报告在 .opencode/.dag-specs/review-parts/review-*.md，可作为补充上下文。

          你的职责：
          1. 对每个 CONFIRMED finding 评估真实 severity（审查者可能高估/低估）
          2. REFUTED 声明直接丢弃，不进 findings
          3. PARTIALLY_CONFIRMED 以修正后的描述纳入
          4. 去重描述同一根因的 findings
          5. 按影响排序
          6. 给出 fail-closed 门禁判决：
             - PASS: 无未解决的 material finding；范围与证据覆盖完整
             - LOOP: 有界定向审查可解决特定遗漏或争议
             - BLOCKED: 证据不足、关键矛盾未解决、进度停滞、或图上限耗尽
          7. LOOP 必须命名最小新审查/验证范围。绝不意味着重跑整个图或重启已完成节点。
          8. 审计每个父声明的 prune：缺失 prune_reason 或 replacement_coverage 禁止 PASS。
          9. 陈述 reason、evidence、stop_reason 与确切 next_action。裸结论不是有效判决。

          父会话处置契约：PASS → finalize；LOOP → pause/replan/resume 全新定向审查+验证+仲裁节点；BLOCKED → stop。父会话不得把 LOOP 重新解释为建议性接受。

          通过 submit_result 提交结构化判决。
    # ---- Continuation ----
    - id: deep-dive
      name: "Plan the bounded fresh review loop"
      worker_type: general
      depends_on: [arbitrate]
      condition: 'arbitrate.output.verdict == "LOOP"'
      required: true
      report_to_parent: true
      prompt_template:
        inline: |
          仲裁者要求 LOOP。为新的定向审查波产出最小 replan fragment 提案：只包含缺失或有争议的范围，分配新节点 ID，保持真实工件依赖，新增 fresh 验证者与新仲裁者，并保持在图上限内。只读：不要修代码。

          返回 loop 原因、新节点、依赖、每个节点必须收集的证据、验收条件与 stop reason。父会话必须 pause → replan → resume；绝不重启已完成节点或创建环。
    - id: finalize-review
      name: "Publish the accepted deep-review report"
      worker_type: general
      depends_on: [arbitrate]
      condition: 'arbitrate.output.verdict == "PASS"'
      required: true
      report_to_parent: true
      prompt_template:
        inline: |
          发布最终证据驱动的 review 报告：范围覆盖、确认的 findings、丢弃/反驳的声明、验证证据、残余低风险项、最终 PASS 理由。不引入上游未验证的新 findings 或声明。报告应直接写入 .opencode/.dag-specs/review-parts/FINAL-REPORT.md，并在会话最终文本中给出完整摘要。
