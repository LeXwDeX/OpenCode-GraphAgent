# Loop-1 extension fragment for workflow deep-review-diff-error-class-continue.
# Scope is EXACTLY arbitrate.loop_scope: one bounded repair-spec author for the
# five adjudicated guidance-doc defects, one fresh verifier, one new arbiter.
# Read-only everywhere. The 8 persisted reports in .opencode/.dag-specs/review-parts-diff/
# are read-only inputs and are NEVER re-executed. Caps check: 4 existing + 3 = 7 nodes
# <= max_total_nodes 10; linear chain fits max_concurrency 2; single bounded wave fits
# max_node_replan_attempts 2.
nodes:
  - id: loop1-repair-spec
    name: "Deep-dive: corrected repair spec for the 5 adjudicated guidance-doc defects"
    worker_type: general
    depends_on: [arbitrate]
    required: true
    worker_config:
      timeout_ms: 900000
    output_schema:
      type: object
      required: [defects, corrections_incorporated, optional_test_plan]
      properties:
        defects:
          type: array
          items:
            type: object
            required: [finding_id, target, current_text, replacement_text, justification]
            properties:
              finding_id: { type: string }
              target: { type: string }
              current_text: { type: string }
              replacement_text: { type: string }
              justification: { type: string }
        corrections_incorporated:
          type: array
          items: { type: string }
        optional_test_plan:
          type: array
          items: { type: string }
    prompt_template:
      inline: |
        You are a READ-ONLY repair-spec author. Do not modify any file. The upstream
        deep review's arbiter ruled LOOP; its adjudicated findings ({{arbitrate}}) are
        your sole mandate. Persisted upstream reports are read-only context in
        .opencode/.dag-specs/review-parts-diff/. Never propose re-running any wave.

        For each defect below produce EXACT replacement wording (verbatim markdown) for
        the diff author, anchored to the cited file:line, and justify each line against
        the adjudicated evidence:

        1. F1 HIGH — packages/core/src/plugin/command/workflow.md:412 dependency-cascade
           triage row: rewrite detection to the two REAL cascade signals —
           (a) required-root failure leaves transitive dependents durably pending while
           the workflow is failed (scheduling.ts:108-120,162); (b) optional-root failure
           places 'Dependency "X" failed/skipped' placeholder text inside dependents'
           PROMPT CONTEXT only (loop.ts:132-136; dag-wake-integration.test.ts:438).
           Never claim that prefix appears in error_reason (19-site producer inventory +
           dag.ts:488-494 refute it). Fix the response: repair root X; for (a) continue
           with root replaced — pending dependents resume naturally and must NOT be
           replaced; for (b) re-run dependents that consumed placeholder input.
        2. F2 MEDIUM — workflow.md:409 exec_failed row: add ownership-loss
           (recovery.ts:141) and workflow-collateral reasons (dag.ts:487-495;
           loop.ts:272,830: orchestrator_unresponsive / required node(s) failed /
           workflow_failed) plus replan-ceiling (dag.ts:599), condition-eval (loop.ts:114),
           template-resolution (loop.ts:173); gate the response on the reason (config
           fixes only for model/auth/provider/template/condition; replace+rerun for
           ownership loss; sibling root-cause for collateral kills).
        3. F3 MEDIUM — workflow.md:410 verdict_fail row: split ran-but-broke-contract
           (submit_result/schema/fingerprint) vs never-ran (unresolved placeholders
           loop.ts:186 / review input contract loop.ts:153 → fix template or input
           mapping, then rerun).
        4. F4 MEDIUM — workflow.md:404 + dag-flow.txt:37 'every failed node carries an
           error_class': qualify — cancelled-via-replan rows project status=failed,
           error_reason 'cancelled via replan', NO error_class (projector.ts:320-323;
           excluded by digest filter loop.ts:856); same for pre-migration rows; add the
           one-line 'no repair needed' note.
        5. F7 LOW — value-set enumeration: mark workflow.md:409-412 + dag-flow.txt:37
           lists non-exhaustive ('e.g.') or add push_exhausted with a 'reserved, never
           emitted' note; align dag-event.ts:253 / sql.ts:65 / groups/dag.ts:42-44
           comments. Bundle with F1 wording.

        Mandatory corrections to incorporate (from arbitration; list each in
        corrections_incorporated):
        - 'required node(s) failed: X' is ephemeral WorkflowFailed-event data only —
          never claim it is visible in wake digest or status output.
        - Cancelled-via-replan rows carry no error_class (projector.ts:320-323).
        - The loop.ts:857 Effect.catch arm does not catch defects (they are orDie'd);
          actual DB-error behavior is abort + guarded() log + retry.
        - Digest filter is loop.ts:856; 'every failed node' sentence is workflow.md:404;
          exec_failed tally 10/5/4.

        Read the live files verbatim before writing replacements:
        packages/core/src/plugin/command/workflow.md (esp. :401-427) and
        packages/core/src/plugin/command/dag-flow.txt (:34-46), plus the runtime anchors
        above. Optional: append F5 test-invariant assertions (cancelled row keeps
        errorClass===null; cancelled node absent from wake 'Failed nodes:') as
        optional_test_plan. Submit via submit_result.

  - id: loop1-verify-repair
    name: "Fresh verification of the repair spec against source"
    worker_type: general
    depends_on: [loop1-repair-spec]
    required: true
    worker_config:
      timeout_ms: 900000
    output_schema:
      type: object
      required: [verdict, claim_checks]
      properties:
        verdict:
          type: string
          enum: [VERIFIED, GAPS, BLOCKED]
        claim_checks:
          type: array
          items:
            type: object
            required: [finding_id, status, evidence]
            properties:
              finding_id: { type: string }
              status:
                type: string
                enum: [CONFIRMED, REFUTED, PARTIALLY_CONFIRMED, UNRESOLVABLE]
              evidence: { type: string }
    prompt_template:
      inline: |
        You are a fresh CLAIM VERIFIER. Read-only — do not modify any file.
        Input: the repair spec ({{loop1-repair-spec}}) plus the persisted upstream
        reports in .opencode/.dag-specs/review-parts-diff/ (read-only; do not re-run
        any wave).

        1. For each of the 5 replacement blocks: re-read the target file:line verbatim
           (workflow.md, dag-flow.txt) and every runtime anchor the spec cites
           (loop.ts:132-136,855-862; projector.ts:320-323; dag.ts:487-495,599;
           scheduling.ts:108-120,162; recovery.ts:79-141; sql.ts:65; dag-event.ts:253;
           groups/dag.ts:42-44).
        2. Assert each replacement makes NO claim already refuted upstream: the
           'Dependency "X" failed/skipped' prefix must never be described as an
           error_reason value; workflow-collateral reasons must not be claimed visible
           in wake/status; error_class claims must exclude cancelled-via-replan rows.
        3. Confirm the three mandatory arbitration corrections are present and accurate.
        4. Verdict: VERIFIED only if every block is CONFIRMED; otherwise GAPS naming the
           exact block and defect. Submit via submit_result.

  - id: loop1-arbitrate
    name: "Loop-1 arbiter: accept repair spec or stop"
    worker_type: general
    depends_on: [loop1-verify-repair]
    required: true
    report_to_parent: true
    output_schema:
      type: object
      required: [verdict, reason, loop_scope, stop_reason, next_action]
      properties:
        verdict:
          type: string
          enum: [PASS, LOOP, BLOCKED]
        reason: { type: string }
        loop_scope: { type: array, items: { type: string } }
        stop_reason:
          type: string
          enum: [goal_met, correction_required, evidence_missing, no_progress, round_cap, budget_cap]
        next_action:
          type: string
          enum: [finalize, replan, stop]
    prompt_template:
      inline: |
        You are the LOOP-1 ARBITER. Read-only. Rule on the repair spec
        ({{loop1-repair-spec}}) as checked by the fresh verifier
        ({{loop1-verify-repair}}); upstream adjudication context is in the persisted
        reports under .opencode/.dag-specs/review-parts-diff/ (verify-suite gates all
        PASS — objective evidence stands).

        PASS: all 5 defects covered by exact replacement wording, all verifier
        claim_checks CONFIRMED, mandatory corrections incorporated, no new CRITICAL/HIGH.
        Then stop_reason=goal_met, next_action=finalize; the repair spec is the final
        deliverable for the diff author.
        LOOP: allowed at most once more and only for a named defect in the spec itself;
        this is the bounded final wave (max_node_replan_attempts=2) — on any further
        non-PASS report BLOCKED/round_cap/stop with residual findings instead of looping.
