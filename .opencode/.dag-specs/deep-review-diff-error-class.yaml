title: "Deep diff review: error_class exposure + wake attribution + failure triage guidance"
mode: deep
admission:
  brief_revision: 1
  qa_mode: LIGHT
  verdict: READY
  brief:
    goal: "Jointly deep-review the uncommitted working-tree diff: failure-class exposure (error_class persistence, status/wake/httpapi/SDK surfaces), wake attribution semantics, and the failure-triage guidance prompts — plus the earlier Resume-first optimization in dag-flow.txt"
    scope:
      in:
        - "git diff HEAD across packages/core (migration, sql, store, projector, workflow.md, dag-flow.txt, schema.json, migration.gen.ts, schema.gen.ts)"
        - "packages/opencode (runtime/loop.ts wake summary, tool/workflow.ts status, httpapi groups+handlers, test/dag edits)"
        - "packages/sdk/js/src/v2/gen/types.gen.ts regenerated field"
        - "cross-cutting consistency: docs vs runtime semantics, schema vs SDK vs httpapi, test coverage of new behavior"
      out:
        - "unchanged DAG module behavior outside the diff"
        - "untracked .opencode/workflows/*.yaml experiment files"
        - "TUI rendering changes (no TUI files were modified)"
    constraints:
      - "reviewers are read-only; do not modify any file"
      - "every material finding must cite file:line evidence"
    assumptions:
      - "the working tree diff against HEAD is the complete review target (uncommitted; includes the pre-existing dag-flow.txt Resume-first section)"
      - "migration/schema.gen/registry files were generated by bun script/migration.ts"
    acceptance_criteria:
      - "no unresolved CRITICAL/HIGH finding on verified evidence"
      - "error_class value set is consistent end-to-end (event trigger enum -> projector -> read surfaces)"
      - "workflow.md/dag-flow.txt guidance matches actual runtime semantics"
      - "regenerated SDK diff is exactly the intended field; repo contract obligations (check:generated, httpapi exercise) satisfied"
    evidence_required:
      - "file:line citations for static claims"
      - "executed test-suite and typecheck results for runtime claims"
    risks:
      - "prompt guidance diverging from runtime semantics (e.g. timeout handling, terminal irreversibility)"
      - "wake-path races or ordering regressions in loop.ts delivery"
      - "documentation drift between the new triage section and existing guidance sections"
    review_plan:
      - "wave 1: consolidated diff scope map + reference manifest"
      - "wave 2: six parallel dimension reviewers (dataflow integrity, runtime semantics, httpapi/SDK contract, prompt accuracy, test coverage, style)"
      - "wave 3: claim verification + objective test-suite execution"
      - "wave 4: advanced-tier arbiter with PASS/LOOP/BLOCKED verdict and bounded-loop continuation"
    open_questions: []
    blocking_questions: []
config:
  name: deep-review-diff-error-class
  max_concurrency: 8
  max_node_replan_attempts: 3
  max_total_nodes: 25
  node_defaults:
    required: false
    report_to_parent: false
    worker_config:
      timeout_ms: 600000
  nodes:
    - id: scope-diff
      name: "Scope: consolidated diff map + manifest"
      worker_type: explore
      depends_on: []
      required: true
      prompt_template:
        inline: |
          You are the SCOPE MAPPER for a deep review of the uncommitted working-tree diff
          in this repository. Read-only — do not modify any file.

          Run `git diff HEAD --stat` and `git diff HEAD` (split by file if large; also
          `git status --short` for untracked context) and produce:

          1. Consolidated change map: every changed file grouped by area:
             - persistence: packages/core/src/database/migration/20260803073521_workflow_node_error_class.ts, sql.ts, store.ts, projector.ts, migration.gen.ts, schema.gen.ts, schema.json
             - read surfaces: packages/opencode/src/tool/workflow.ts (status output), src/dag/runtime/loop.ts (wake summary), src/server/routes/instance/httpapi/groups/dag.ts + handlers/dag.ts
             - SDK: packages/sdk/js/src/v2/gen/types.gen.ts
             - guidance docs: packages/core/src/plugin/command/workflow.md, dag-flow.txt
             - tests: packages/opencode/test/dag/{fixtures.ts,workflow-tool.test.ts,dag-wake-integration.test.ts}
          2. For each area, the intent of the change (infer from content; the stated
             purpose: persist the node failure class that previously existed only in
             dag.node.failed events, expose it on every agent-visible surface, and add
             failure-triage guidance so the parent agent repairs the failed node instead
             of restarting the workflow).
          3. Verify and emit the reference manifest exactly as follows, correcting only
             factual errors:
             - reference_template: deep-review-dag-module
             - added nodes: scope-diff, review-dataflow, review-runtime, review-contract, review-prompts, review-tests, review-style, verify-suite
             - pruned lanes: {node: explore-core, prune_reason: target is a bounded 16-file diff, not the whole module, replacement_coverage: scope-diff consolidated change map injected into every reviewer lane} and the same prune_reason/replacement_coverage for explore-runtime, explore-templates, explore-integrations
          4. List any changed file whose hunks appear UNRELATED to the stated purpose
             (these become arbiter audit items).
          5. Note pre-existing uncommitted content: the dag-flow.txt "Resume-first"
             section predates this session's triage sentence — review it as part of the
             joint diff per the user's request.

          Output the full map; downstream reviewers receive it as context.

    - id: review-dataflow
      name: "Review: error_class dataflow integrity"
      worker_type: general
      depends_on: [scope-diff]
      prompt_template:
        inline: |
          You are a DATAFLOW INTEGRITY REVIEWER. Read-only — do not modify any file.
          Review target: the uncommitted working-tree diff (`git diff HEAD`).
          Upstream scope map is provided as context; verify against actual code.

          Trace the error_class value end to end:
          - Producer: packages/schema/src/dag-event.ts NodeFailed trigger literals
            (exec_failed/push_exhausted/verdict_fail/timeout) and every
            dag.nodeFailed call site (packages/opencode/src/dag/{dag.ts,runtime/loop.ts,runtime/spawn.ts,runtime/recovery.ts}) — which triggers are actually produced? Note any literal with no producer (push_exhausted) and whether that matters.
          - Persistence: migration 20260803073521_workflow_node_error_class, sql.ts
            column, store.ts NodeRow.errorClass + mapNode, projector.ts NodeFailed
            projection — check the projector sets error_class from event.data.trigger,
            that NodeCancelled/NodeSkipped leave it null deliberately, and that the
            projector race from-guards are untouched/correct.
          - Read surfaces: tool/workflow.ts status output, loop.ts wake node-line
            suffix and failed-workflow digest filter (status failed && errorClass !=
            null), httpapi NodeResponse optional field + handler mapper, SDK
            types.gen.ts DagNode.error_class.
          - Consistency: same value vocabulary on every surface; any consumer that
            assumes values the producer never emits; any surface that strips or
            renames the field inconsistently.

          MANDATORY output format:
          1. findings: array of {severity: CRITICAL|HIGH|MEDIUM|LOW, title, description, evidence: "file:line", recommendation}
          2. unverified_claims: array of strings
          3. summary: 2-3 sentences

    - id: review-runtime
      name: "Review: wake-loop runtime semantics"
      worker_type: general
      depends_on: [scope-diff]
      prompt_template:
        inline: |
          You are a RUNTIME SEMANTICS REVIEWER. Read-only — do not modify any file.
          Review target: packages/opencode/src/dag/runtime/loop.ts uncommitted hunks
          (the new failed-workflow attribution read and the node-line class suffix)
          plus their interaction with surrounding delivery logic.

          Review criteria:
          - The new failuresByWorkflow read happens inside the wake delivery generator:
            correctness of the Effect.catch fallback to [], lock/ordering hazards vs
            the existing evalLock/workflowLock discipline, and whether the extra store
            read can delay or reorder wake delivery or wake_reported persistence.
          - Double reporting: a failed wake-eligible node can appear both in the node
            line (with class suffix) and in its workflow's Failed nodes digest — assess
            whether that is acceptable, confusing, or harmful to the parent's decision.
          - Truncation: per-line slice(0, 300) and output slice(0, 500) — multibyte
            safety, worst-case summary size for a workflow with many failed nodes.
          - Interaction with orchestrator_unresponsive and the actionableDagIDs
            mandatory-action line; any path where a failed workflow now delivers
            attribution but the mandatory-action guidance contradicts it.
          - Regression risk for unchanged paths: completed/cancelled workflows must
            produce exactly the old terminal line; skipped-node wakes unchanged.

          MANDATORY output format:
          1. findings: array of {severity: CRITICAL|HIGH|MEDIUM|LOW, title, description, evidence: "file:line", recommendation}
          2. unverified_claims: array of strings
          3. failure_scenarios: array of {scenario, impact, likelihood: HIGH|MEDIUM|LOW}
          4. summary: 2-3 sentences

    - id: review-contract
      name: "Review: HTTP API + SDK contract"
      worker_type: general
      depends_on: [scope-diff]
      prompt_template:
        inline: |
          You are an API CONTRACT REVIEWER. Read-only — do not modify any file.
          Review target: the uncommitted httpapi + SDK hunks plus the repo's contract
          obligations documented in AGENTS.md (repo root and packages/opencode).

          Review criteria:
          - NodeResponse schema (packages/opencode/src/server/routes/instance/httpapi/groups/dag.ts)
            vs handler mapper (handlers/dag.ts) vs regenerated SDK type
            (packages/sdk/js/src/v2/gen/types.gen.ts DagNode): exact field-name and
            optionality alignment; encoder strips undeclared fields — is anything
            emitted but undeclared or declared but never emitted?
          - Regeneration freshness: run `git diff HEAD -- packages/sdk/js/src/v2/gen`
            and confirm the ONLY change is the optional error_class field; check no
            other generated file drifted.
          - AGENTS.md obligations: route response shape changes require updating
            test/server/httpapi-exercise scenarios — inspect the dag scenarios under
            packages/opencode/test/server/httpapi-exercise/ and determine whether an
            optional response-field addition needs scenario updates (check how the
            scenario asserts responses). Also check whether packages/client duplicates
            DagNode anywhere that now drifts.
          - TUI consumers of DagNode (packages/tui dag-inspector): any consumer that
            could display the new field or breaks on it.

          MANDATORY output format:
          1. findings: array of {severity: CRITICAL|HIGH|MEDIUM|LOW, title, description, evidence: "file:line", recommendation}
          2. unverified_claims: array of strings
          3. summary: 2-3 sentences

    - id: review-prompts
      name: "Review: guidance accuracy vs runtime semantics"
      worker_type: general
      depends_on: [scope-diff]
      prompt_template:
        inline: |
          You are a PROMPT-ACCURACY REVIEWER. Read-only — do not modify any file.
          Review target: packages/core/src/plugin/command/workflow.md new "Node
          failure triage" section and the dag-flow.txt Resume-first triage sentence,
          checked against ACTUAL runtime behavior. These prompts steer the parent
          agent's wake-time repair decisions; any semantic drift is a bug.

          Verify every factual claim against code:
          - "timeout: the runtime cancelled its child session at the deadline" — check
            packages/opencode/src/dag/runtime/spawn.ts timeout path (promptSvc.cancel)
            and recovery.ts deadline handling. Is "Check its child_session_id for
            partial artifacts" accurate (session/messages persist after cancel)?
          - "exec_failed: unknown/wrong model, auth, rate-limit, connection errors, or
            recovery reasons ('no child session on recovery', 'child session failed
            (recovered)')" — confirm these exact reason strings/classes exist
            (recovery.ts ~79/108, spawn.ts ~300 Cause.pretty path) and that a wrong
            model-config error actually surfaces as exec_failed with discoverable text.
          - "verdict_fail: missing submit_result, schema rejection, review fingerprint
            mismatch" — check capture.ts settleCapturedOutput reasons plus
            loop.ts unresolved-placeholder/review-input-contract paths.
          - "Budget exhaustion: replan attempt ceiling exceeded / Total node ceiling
            exceeded" — confirm exact strings (dag.ts) and that the Escalation
            cross-reference exists.
          - "Workflow still live: control(pause) -> control(replan) with replacement
            node under NEW id ... extend also works" — verify against dag.ts _extend/_replan.
          - "Workflow terminal failed: terminal status is irreversible — you cannot
            replan it" — verify the _replan terminal guard and
            getValidNextWorkflowStatuses FAILED -> [ARCHIVED]; verify the continuation
            workflow advice (reuse completed outputs as static input) is feasible.
          - Cross-doc consistency: no contradiction with the Crash recovery section,
            Verdict Disposal Contract, Bounded Repair, Adaptive Replanning, or the
            pre-existing dag-flow.txt Resume-first steps; both docs agree on the
            replacement-node-under-new-id mechanic.
          - Triage table row "reason starts with Dependency X failed/skipped" — is
            that how cascade actually appears to the agent (check loop.ts dependency
            interpolation and scheduler behavior for failed deps)?

          MANDATORY output format:
          1. findings: array of {severity: CRITICAL|HIGH|MEDIUM|LOW, title, description, evidence: "file:line", recommendation}
          2. unverified_claims: array of strings
          3. summary: 2-3 sentences

    - id: review-tests
      name: "Review: test coverage of the diff"
      worker_type: general
      depends_on: [scope-diff]
      prompt_template:
        inline: |
          You are a TEST COVERAGE REVIEWER. Read-only — do not modify any file.
          Review target: the uncommitted test hunks (packages/opencode/test/dag/
          fixtures.ts, workflow-tool.test.ts, dag-wake-integration.test.ts) versus the
          behaviors the diff introduces.

          Review criteria:
          - Do the new assertions actually cover: projector persistence of error_class
            (asserted via store.getNode), status-tool error_class output, wake
            node-line class suffix, wake failed-workflow Failed nodes digest
            (exact string assertions — are they too brittle or exactly right)?
          - Missing coverage candidates — assess each: recovery.ts failure paths
            (timeout/exec_failed/verdict_fail on recovery), NodeCancelled rows keeping
            errorClass null, multiple failed nodes digest ordering/truncation, empty
            errorReason fallback "unknown error", httpapi node endpoint returning the
            field.
          - Test hygiene: fixture defaults keep old tests valid; added mock node in
            workflow-tool.test.ts is realistic (status transition, seq, timestamps);
            no duplicated logic into tests.
          - Do existing suites elsewhere depend on NodeRow shape and were they all
            updated (search for NodeRow literals in packages/core tests too)?

          MANDATORY output format:
          1. findings: array of {severity: CRITICAL|HIGH|MEDIUM|LOW, title, description, evidence: "file:line or test path", recommendation}
          2. unverified_claims: array of strings
          3. coverage_gaps: array of {path, untested_scenarios: string[]}
          4. summary: 2-3 sentences

    - id: review-style
      name: "Review: style & repo conventions"
      worker_type: general
      depends_on: [scope-diff]
      prompt_template:
        inline: |
          You are a STYLE & CONVENTIONS REVIEWER. Read-only — do not modify any file.
          Review target: all uncommitted code hunks (`git diff HEAD`).

          Review against the root AGENTS.md Style Guide and package AGENTS.md files:
          - Comments: allowed only for non-obvious constraints — judge the new
            comments (sql.ts column comment, groups/dag.ts field comment, migration
            none, loop.ts none) against that rule.
          - const over let, no else, no unnecessary destructuring, no import aliases,
            functional style; Effect conventions from packages/opencode/AGENTS.md
            (Effect.fn naming, catch usage, no nested service yields).
          - Migration conventions: file naming/id format vs existing migrations;
            drizzle snake_case column rule; registry/schema.gen regenerated properly.
          - Doc style: workflow.md section placement/heading level consistency with
            neighbors; table formatting; dag-flow.txt sentence integration.
          - Test style: matches existing assertion patterns in the touched files.

          MANDATORY output format:
          1. findings: array of {severity: CRITICAL|HIGH|MEDIUM|LOW, title, description, evidence: "file:line", recommendation}
          2. unverified_claims: array of strings
          3. summary: 2-3 sentences

    - id: verify-claims
      name: "Verify Disputed Claims"
      worker_type: general
      depends_on: [review-dataflow, review-runtime, review-contract, review-prompts, review-tests, review-style]
      required: true
      output_schema:
        type: object
        required: [verdict, verified_claims, disputed_findings_resolution, critical_findings_status, coverage_gaps, evidence_quality]
        properties:
          verdict:
            type: string
            enum: [VERIFIED, GAPS, BLOCKED]
          verified_claims: { type: array, items: { type: object } }
          disputed_findings_resolution: { type: array, items: { type: object } }
          critical_findings_status: { type: array, items: { type: object } }
          coverage_gaps: { type: array, items: { type: object } }
          evidence_quality: { type: string }
      prompt_template:
        inline: |
          You are a CLAIM VERIFIER. Read-only — do not modify any file.

          Six reviewers produced findings and unverified_claims about the uncommitted
          diff. You are the fresh-context verification wave. Check every
          unverified/disputed/CRITICAL/HIGH claim against the actual code; sample
          MEDIUM/LOW claims instead of trusting self-report.

          Upstream context contains all 6 reviewer outputs. Extract:
          1. All unverified_claims items
          2. Findings where reviewers disagree
          3. All CRITICAL/HIGH findings (must be verified regardless)
          4. Any diff area with no evidence-bearing reviewer output
          5. Any prompt-guidance factual claim (review-prompts) — these ALL need code
             confirmation because the prompts steer parent-agent repair decisions

          For each claim, read the actual source at the cited location and determine
          CONFIRMED / REFUTED / PARTIALLY_CONFIRMED / UNRESOLVABLE with the exact line.

          Verdict:
          - VERIFIED: every material scope/criterion covered, no material claim unresolved
          - GAPS: a bounded fresh review can close named gaps
          - BLOCKED: required evidence cannot be obtained

          Submit the structured result. coverage_gaps must name the missing scope,
          evidence, and the smallest reviewer lane that should be added in a LOOP.

    - id: verify-suite
      name: "Verify: execute tests and gates"
      worker_type: general
      depends_on: [scope-diff]
      required: true
      worker_config:
        timeout_ms: 900000
      output_schema:
        type: object
        required: [verdict, results, anomalies]
        properties:
          verdict:
            type: string
            enum: [PASS, FAIL, BLOCKED]
          results:
            type: array
            items:
              type: object
              required: [gate, command, outcome, detail]
              properties:
                gate: { type: string }
                command: { type: string }
                outcome: { type: string, enum: [PASS, FAIL, SKIPPED] }
                detail: { type: string }
          anomalies: { type: array, items: { type: string } }
      prompt_template:
        inline: |
          You are an OBJECTIVE GATE RUNNER. You execute commands and report results
          faithfully. Do NOT modify any file. Do not fix failures — report them.

          Run these gates in order (each from the stated directory):
          1. typecheck core: bun run typecheck (packages/core)
          2. typecheck opencode: bun run typecheck (packages/opencode)
          3. opencode DAG suites: bun test test/dag (packages/opencode)
          4. core DAG suites: bun test test/dag-core.test.ts test/dag-projector-drift.test.ts test/dag-store-summaries.test.ts test/plugin/command.test.ts (packages/core)
          5. migration check: bun script/migration.ts --check (packages/core)
          6. HttpAPI contract: bun run test:httpapi --fail-on-missing (packages/opencode)
          7. SDK freshness: in packages/sdk/js run bun run build, then
             `git diff -- packages/sdk/js/src/v2/gen`. IMPORTANT interpretation: this
             working tree intentionally adds DagNode.error_class uncommitted — the gate
             PASSES iff the ONLY diff lines in src/v2/gen are the added error_class
             field (one insertion in types.gen.ts) and the regeneration produced no
             OTHER drift. Do not fail on the intended field itself.

          For each gate record outcome + the decisive output fragment. Verdict PASS
          only if all gates pass under that interpretation; FAIL lists each failing
          gate with evidence; BLOCKED if a gate cannot run (state why).

    - id: arbitrate
      name: "Arbiter: Final Verdict"
      worker_type: general
      depends_on: [verify-claims, verify-suite]
      required: true
      report_to_parent: true
      output_schema:
        type: object
        required: [verdict, reason, evidence, findings, loop_scope, stop_reason, next_action, prune_decisions]
        properties:
          verdict:
            type: string
            enum: [PASS, LOOP, BLOCKED]
          reason: { type: string }
          evidence:
            type: array
            items: { type: string }
          findings:
            type: array
            items:
              type: object
              required: [severity, title, evidence, status]
              properties:
                severity:
                  type: string
                  enum: [CRITICAL, HIGH, MEDIUM, LOW]
                title: { type: string }
                description: { type: string }
                evidence: { type: string }
                status:
                  type: string
                  enum: [CONFIRMED, REFUTED, PARTIALLY_CONFIRMED]
                recommendation: { type: string }
          loop_scope:
            type: array
            items: { type: string }
          stop_reason:
            type: string
            enum: [goal_met, correction_required, evidence_missing, no_progress, round_cap, budget_cap]
          next_action:
            type: string
            enum: [finalize, replan, stop]
          prune_decisions:
            type: array
            items:
              type: object
              required: [node, prune_reason, replacement_coverage]
              properties:
                node: { type: string }
                prune_reason: { type: string }
                replacement_coverage: { type: string }
      prompt_template:
        inline: |
          You are the ARBITER for this deep review of the uncommitted diff. You rule on
          VERIFIED evidence only. The verification wave (verify-claims) and the
          objective gate runner (verify-suite) outputs are your primary evidence base;
          the 6 reviewer outputs are context.

          Your job:
          1. For each CONFIRMED finding, assess true severity (reviewers may over/under-rate)
          2. Discard REFUTED claims; correct PARTIALLY_CONFIRMED descriptions
          3. Deduplicate findings sharing a root cause; rank by impact
          4. Weight verify-suite gate failures: any real gate failure under the stated
             interpretation is at least HIGH; a broken prompt-guidance factual claim is
             at least HIGH because it mis-steers future parent-agent repair decisions
          5. Audit the reference manifest from scope-diff: prune decisions must carry
             prune_reason + replacement_coverage; flag any changed file unrelated to the
             stated purpose
          6. Verdict:
             - PASS: no unresolved material finding; scope and evidence coverage complete
             - LOOP: a bounded targeted review can resolve specific omissions/disputes
             - BLOCKED: evidence insufficient, critical contradiction unresolved, or ceiling reached
          7. LOOP names the minimal new scope; never rerun the whole graph
          8. State reason, evidence, stop_reason, next_action explicitly

          Parent disposal contract: PASS -> finalize; LOOP -> pause/replan/resume fresh
          targeted review + verification + arbiter nodes; BLOCKED -> stop.

          Submit your structured verdict via submit_result.

    - id: deep-dive
      name: "Plan the bounded fresh review loop"
      worker_type: general
      depends_on: [arbitrate]
      condition: 'arbitrate.output.verdict == "LOOP"'
      required: true
      report_to_parent: true
      prompt_template:
        inline: |
          The arbiter required LOOP. Produce a minimal replan fragment proposal for a
          NEW local review wave. Include only the missing or disputed scope from the
          arbiter's loop_scope, assign NEW node IDs, preserve real artifact
          dependencies, add a fresh verifier and a new arbiter, and stay within the
          workflow caps. Read-only: do not fix code.

          Return the loop reason, new nodes, dependencies, evidence each node must
          collect, acceptance condition, and stop reason. The parent must pause, replan,
          and resume; it must never restart completed nodes or create a cycle.

    - id: finalize-review
      name: "Publish the accepted deep-review report"
      worker_type: general
      depends_on: [arbitrate]
      condition: 'arbitrate.output.verdict == "PASS"'
      required: true
      report_to_parent: true
      prompt_template:
        inline: |
          Publish the final evidence-backed review report for the uncommitted diff.
          Include: scope coverage, confirmed findings (severity-ranked with file:line
          evidence), discarded/refuted claims, gate-runner results, residual low-risk
          issues, and the final PASS reason. Do not introduce new findings or claims
          that were not verified upstream.
