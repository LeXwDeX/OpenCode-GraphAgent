title: "Round 3 final audit: confirm remediation closure on the joint diff"
mode: deep
admission:
  brief_revision: 1
  qa_mode: LIGHT
  verdict: READY
  brief:
    goal: "Final audit round of the uncommitted joint diff: verify every round-2 LOOP finding is closed by in-tree remediation, re-run all objective gates, and confirm no unresolved material bug remains"
    scope:
      in:
        - "Round-2 HIGH cluster resolutions: workflow.md cascade rewrite (skipped terminalization + paused-pending nuance), exec_failed (c) row no-attribution rewrite + orchestrator_unresponsive recipe, dag-flow.txt exception clause"
        - "Round-2 test item: new prompt.test.ts goal/subgoal dispatch tests (set+kick loop, status, subgoal, Goal-absent fallthrough)"
        - "Round-2 MEDIUM follow-up pulled into the fix wave: SystemPrompt Goal.node + Goal.defaultLayer wiring so the goal system block renders"
        - "LOW cleanups: app-runtime provideMerge comment correction, GOAL command description 'done'"
        - "Regression spot-check over previously reviewed areas (error_class pipeline, wake digest, goal restoration surfaces)"
      out:
        - "Arbiter-deferred follow-ups explicitly accepted as non-blocking: GET /session/:id/goal null-vs-Goal typing, httpapi error_class field-level fixture, TUI sync reducer tests, GoalLoop e2e fixed sleeps"
        - "committed baseline behavior outside the diff"
    constraints:
      - "reviewers are read-only; do not modify any file"
      - "every material finding must cite file:line evidence"
    assumptions:
      - "the remediation wave is complete: docs rewritten, SystemPrompt wired, 4 dispatch tests added and passing locally"
      - "deferred follow-ups are documented findings, not unresolved bugs, unless re-graded material by this round"
    acceptance_criteria:
      - "each round-2 HIGH finding verifiably closed (quote the fixing code/doc line)"
      - "no NEW CRITICAL/HIGH finding on verified evidence"
      - "all objective gates PASS under the SDK-freshness interpretation (intended uncommitted additions allowed)"
    evidence_required:
      - "file:line citations for closure claims"
      - "executed gate results"
    risks:
      - "remediation wording introducing fresh guidance-vs-runtime drift"
      - "SystemPrompt wiring changing layer construction for existing consumers"
    review_plan:
      - "wave 1: fresh-context remediation review (closure verification + regression scan)"
      - "wave 2: objective gate runner"
      - "wave 3: advanced-tier arbiter PASS/LOOP/BLOCKED"
    open_questions: []
    blocking_questions: []
config:
  name: deep-review-round3-final
  max_concurrency: 4
  max_node_replan_attempts: 2
  max_total_nodes: 10
  node_defaults:
    required: false
    report_to_parent: false
    worker_config:
      timeout_ms: 900000
  nodes:
    - id: review-final
      name: "Review: remediation closure + regression scan"
      worker_type: general
      depends_on: []
      required: true
      prompt_template:
        inline: |
          You are a FRESH-CONTEXT FINAL REVIEWER. Read-only — do not modify any file.
          The repo's uncommitted working-tree diff contains a joint change set (DAG
          error_class exposure, /goal restoration, two remediation waves). A prior
          review round returned LOOP with five HIGH findings; a remediation wave claims
          they are closed. Your job is closure verification + regression scan.

          Verify each round-2 HIGH is actually closed (cite the fixing lines):
          1. workflow.md "Cascade detection" section: the required-failure shape must
             state dependents are terminalized to `skipped` with error_reason
             `workflow_failed` (pending only while paused) — check this matches
             dag.ts terminateNonTerminalNodes + loop.ts dag.fail wiring.
          2. workflow.md exec_failed row (c): must NOT reference a surfaced
             workflow-level reason or a universally-available primary-node attribution;
             must carry an orchestrator_unresponsive recipe (zero attribution; use
             status; extend/replan or change approach). Cross-check against
             dag.ts fail() + loop.ts:272 `required node(s) failed:` producer and the
             wake digest surface (loop.ts failuresByWorkflow) to confirm what IS visible.
          3. dag-flow.txt: the error_class sentence must carry the replan-cancel and
             pre-migration exceptions.
          4. packages/opencode/test/session/prompt.test.ts: new tests must exist and
             meaningfully cover /goal set+kick, /goal status, /subgoal, and Goal-absent
             fallthrough (read the tests; judge assertion strength, not just existence).
          5. SystemPrompt wiring: packages/opencode/src/session/system.ts must provide
             Goal.defaultLayer + Goal.node so the goal block is reachable; verify no
             layer-cycle or construction-order hazard (goal imports must not close a
             TDZ cycle like the deferred SettingsHook pattern guards against).

          Regression scan (spot-check, evidence-based):
          - error_class pipeline untouched by the remediation wave? (projector, store,
            tool status, wake digest, httpapi NodeResponse, SDK)
          - app-runtime provideMerge comment now accurate vs loop.ts/settings.ts
            self-provides?
          - GOAL command description includes done; dispatch handles done (goal.ts)?

          Known deferred follow-ups (do NOT re-grade unless clearly material):
          GET /session/:id/goal returns 200 JSON null vs SDK Goal (non-null); httpapi
          error_class field-level fixture absent; TUI sync reducer untested; GoalLoop
          e2e fixed sleeps.

          MANDATORY output format:
          1. closure: array of {round2_finding, status: CLOSED|PARTIAL|OPEN, evidence: "file:line", note}
          2. findings: array of {severity: CRITICAL|HIGH|MEDIUM|LOW, title, description, evidence: "file:line", recommendation} (NEW issues only)
          3. unverified_claims: array of strings
          4. summary: 2-3 sentences

    - id: verify-suite
      name: "Verify: execute all gates"
      worker_type: general
      depends_on: []
      required: true
      output_schema:
        type: object
        required: [verdict, results, anomalies]
        properties:
          verdict:
            type: string
            enum: [PASS, FAIL, BLOCKED]
          results:
            type: array
            items:
              type: object
              required: [gate, command, outcome, detail]
              properties:
                gate: { type: string }
                command: { type: string }
                outcome: { type: string, enum: [PASS, FAIL, SKIPPED] }
                detail: { type: string }
          anomalies: { type: array, items: { type: string } }
      prompt_template:
        inline: |
          You are an OBJECTIVE GATE RUNNER. Execute commands and report faithfully.
          Do NOT modify any file. Do not fix failures — report them.

          Gates (each from the stated directory):
          1. typecheck core: bun run typecheck (packages/core)
          2. typecheck opencode: bun run typecheck (packages/opencode)
          3. opencode DAG suites: bun test test/dag (packages/opencode)
          4. goal + dispatch suites: bun test test/goal test/tool/goal-tool.test.ts test/session/prompt.test.ts (packages/opencode)
          5. core suites: bun test test/dag-core.test.ts test/dag-projector-drift.test.ts test/dag-store-summaries.test.ts test/plugin/command.test.ts (packages/core)
          6. migration check: bun script/migration.ts --check (packages/core)
          7. HttpAPI contract: bun run test:httpapi --fail-on-missing (packages/opencode)
          8. SDK freshness: in packages/sdk/js run bun run build, then
             `git diff -- packages/sdk/js/src/v2/gen`. Interpretation: the working
             tree intentionally adds (uncommitted) Goal types + session.goal method +
             DagNode.error_class — PASS iff the gen diff contains ONLY those intended
             additions and no other drift.

          Record outcome + decisive output fragment per gate. Verdict PASS only if all
          gates pass under the interpretation; FAIL lists failing gates with evidence;
          BLOCKED states why.

    - id: arbitrate
      name: "Arbiter: Final Verdict"
      worker_type: general
      depends_on: [review-final, verify-suite]
      required: true
      report_to_parent: true
      worker_config:
        timeout_ms: 1200000
      output_schema:
        type: object
        required: [verdict, reason, evidence, findings, loop_scope, stop_reason, next_action]
        properties:
          verdict:
            type: string
            enum: [PASS, LOOP, BLOCKED]
          reason: { type: string }
          evidence:
            type: array
            items: { type: string }
          findings:
            type: array
            items:
              type: object
              required: [severity, title, evidence, status]
              properties:
                severity:
                  type: string
                  enum: [CRITICAL, HIGH, MEDIUM, LOW]
                title: { type: string }
                description: { type: string }
                evidence: { type: string }
                status:
                  type: string
                  enum: [CONFIRMED, REFUTED, PARTIALLY_CONFIRMED]
                recommendation: { type: string }
          loop_scope:
            type: array
            items: { type: string }
          stop_reason:
            type: string
            enum: [goal_met, correction_required, evidence_missing, no_progress, round_cap, budget_cap]
          next_action:
            type: string
            enum: [finalize, replan, stop]
      prompt_template:
        inline: |
          You are the ARBITER for the FINAL audit round of the joint uncommitted diff.
          Rule on VERIFIED evidence only: review-final's closure verification +
          verify-suite's gate results.

          This is round 3 of a bounded loop (max_node_replan_attempts: 2). Judgment:
          - PASS: all five round-2 HIGH findings CLOSED, all gates PASS, no new
            CRITICAL/HIGH; the documented deferred follow-ups remain explicitly
            non-blocking (list them in evidence as accepted residual items)
          - LOOP: at most ONE more bounded wave, only for a NEW or reopened HIGH with
            concrete loop_scope; do not loop on deferred follow-ups or cosmetics
          - BLOCKED: evidence missing or ceiling reached; report residual findings

          Deduplicate, discard REFUTED, rank by impact. State reason, evidence,
          stop_reason, next_action explicitly. Submit via submit_result.

    - id: finalize-review
      name: "Publish the final audit report"
      worker_type: general
      depends_on: [arbitrate]
      condition: 'arbitrate.output.verdict == "PASS"'
      required: true
      report_to_parent: true
      prompt_template:
        inline: |
          Publish the final audit report for the joint uncommitted diff: closure table
          for the round-2 HIGH findings (with fix evidence), gate results, confirmed
          residual items with their accepted non-blocking status, and the PASS reason.
          Do not introduce new findings.
