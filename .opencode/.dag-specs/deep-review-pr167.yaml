title: "Deep Review: PR #167 dag-config-repo"
mode: deep
admission:
  brief_revision: 1
  qa_mode: LIGHT
  verdict: READY
  brief:
    goal: "深度 review PR #167（feat/dag-config-repo → dev）的全部变更：DAG 参考模板抽离到独立配置仓库 + /dag-template-update 命令 + release 资产打包 + 二进制内置模板（builtin 三级 scope）"
    scope:
      in:
        - "git diff origin/dev...HEAD 的所有变更：packages/opencode/src/dag/workflows.ts、packages/opencode/src/tool/workflow.ts、packages/opencode/script/generate.ts、packages/opencode/script/build.ts、packages/core/src/plugin/command.ts、packages/core/src/plugin/command/dag-flow.txt、packages/core/src/plugin/command/dag-template-update.txt、.github/workflows/release-fork.yml、测试文件变更（dag-workflows.test.ts）"
        - "相关集成上下文：opencode-dag-config 仓库（唯一权威源）、全局 workflows 目录、测试覆盖"
      out:
        - "本 PR 未改动的 DAG 运行时核心（scheduler/recovery/loop/状态机）"
        - "TUI 深挖"
        - "8 个未跟踪 yaml 模板内容逐行审查（非主对象，仅作上下文）"
    constraints:
      - "只读：不修改任何文件"
      - "每个 reviewer 必须引用 file:line 证据"
      - "无法静态确认的声明必须列入 unverified_claims"
      - "verify 波必须对照实际代码检查所有未验证/争议声明，禁止基于 reviewer 自报通过"
    assumptions:
      - "diff 基准为 origin/dev...HEAD（4 个 commit：676e0463e/6ffc7a712/98e4c0624/2ee59d874）"
      - "已修复项（ReferenceError 守卫、Entry 去重、M4 空 glob、重复下载删除）属于审查对象的一部分，需确认修复正确而非回退"
    acceptance_criteria:
      - "所有 material findings 有 file:line 证据"
      - "无未解析的 CRITICAL/HIGH 发现"
      - "测试执行（bun test dag-workflows/workflow-tool）与类型检查结果作为证据"
      - "prune manifest 被 verify 波审计"
    evidence_required:
      - "file:line 引用"
      - "测试执行结果"
      - "release-fork.yml 静态行为分析（job 图、环境变量注入链）"
    risks:
      - "release 流水线/配置仓库生态的实际行为无法在本地完全验证，只能静态审查"
      - "builtin 注入仅在构建时生效，运行时行为需靠代码审查推断"
    review_plan:
      - "波1 探索：3 个并行 lane（运行时解析/构建注入/CI 流水线）"
      - "波2 审查：5 个并行维度（架构/逻辑/风格/测试/健壮性）"
      - "波3 验证：fresh-context 对照实际代码检查所有 unverified/disputed/CRITICAL/HIGH 声明"
      - "波4 仲裁：PASS/LOOP/BLOCKED，report_to_parent"
      - "续波：LOOP → deep-dive 提案 replan fragment；PASS → finalize-review 发布报告"
    open_questions: []
    blocking_questions: []
config:
  name: deep-review-pr167
  max_concurrency: 5
  max_node_replan_attempts: 3
  max_total_nodes: 30
  node_defaults:
    required: false
    report_to_parent: false
    worker_config:
      timeout_ms: 600000
  nodes:
    # ---- Wave 1: Exploration (parallel) ----
    # Derived from reference_template: deep-review-dag-module.yaml.
    # PRUNE manifest (audited by verify-claims):
    #   - explore-core -> replaced by explore-runtime (targets workflows.ts/workflow.ts instead of dag lifecycle core)
    #     prune_reason: review target is the PR diff, not the untouched dag lifecycle module
    #     replacement_coverage: review-logic/architecture cover the changed runtime surface
    #   - explore-templates -> folded into explore-build (prompt .txt + command registration + generate/build injection)
    #     prune_reason: template rendering pipeline untouched by this PR; only builtin data injection changed
    #     replacement_coverage: explore-build covers generate.ts/build.ts/command.ts/prompt files
    #   - explore-integrations -> pruned; TUI/schema/SDK untouched by this PR
    #     prune_reason: out of scope per admission brief
    #     replacement_coverage: explore-ci covers the release/artifact integration surface
    #   - explore-runtime -> retargeted to explore-runtime (builtin scope resolution) with new scope
    #     prune_reason: original lane targets dag/runtime/ which this PR does not modify
    #     replacement_coverage: workflows.ts resolve/list/readWorkflowSpec fully covered by explore-runtime
    - id: explore-runtime
      name: "Explore: builtin scope resolution"
      worker_type: explore
      depends_on: []
      prompt_template:
        inline: |
          TASK CONTEXT: 深度 review PR #167。diff 命令：git diff origin/dev...HEAD（工作目录：本仓库）。变更集中在 DAG 模板库三级 scope（project/global/builtin）。

          MANIFEST（派生自 reference deep-review-dag-module.yaml，需记录输出供 verify 审计）：
          pruned: explore-core (targeted dag lifecycle core, untouched by PR), explore-templates (folded into explore-build), explore-integrations (TUI/schema/SDK untouched); retargeted: explore-runtime (was dag/runtime/, now builtin scope resolution)

          Explore the changed runtime resolution surface:
          - packages/opencode/src/dag/workflows.ts (full file): Entry interface, scopes(), resolve(), list(), searchPaths(), isBuiltinPath(), builtinName(), builtinEntry(), parseMeta(), describe(), builtinTemplates() with the typeof OPENCODE_DAG_TEMPLATES guard
          - packages/opencode/src/tool/workflow.ts: readWorkflowSpec() builtin branch, resolveSpecPath() bare-name resolution, searchedScopes() helper, list action empty-library message

          Output:
          1. Resolution order and shadowing semantics (project > global > builtin) with line refs
          2. The builtin data flow: where OPENCODE_DAG_TEMPLATES is declared/read, what happens when undefined (dev/test) vs injected (release build)
          3. readWorkflowSpec builtin path: how builtin:// paths are parsed, error handling when content missing, YAML parse failure paths
          4. list() behavior: dedup, sorting, metadata extraction (parseMeta tolerance for malformed specs)
          5. searchedScopes() and not-found/empty messages: what scopes are named, when builtin is mentioned
          6. Any boundary/edge cases: empty builtin map, builtin name shadowed by project, malformed builtin content
    - id: explore-build
      name: "Explore: build injection & commands"
      worker_type: explore
      depends_on: []
      prompt_template:
        inline: |
          TASK CONTEXT: 深度 review PR #167。diff 命令：git diff origin/dev...HEAD。变更集中在模板内嵌构建注入 + /dag-template-update 命令。

          Explore:
          - packages/opencode/script/generate.ts: loadDagTemplatesData() (DAG_TEMPLATES_DIR env contract, Glob scan, name extraction, JSON.stringify output), dagTemplatesData export, comparison with loadModelsData() pattern
          - packages/opencode/script/build.ts: the define injection of OPENCODE_DAG_TEMPLATES, how generated outputs are consumed
          - packages/core/src/plugin/command.ts: the /dag-template-update registration (draft.update pattern), how .txt content is compiled in
          - packages/core/src/plugin/command/dag-template-update.txt (full): zip download flow, dry-run classification (NEW/UNCHANGED/UPDATE), QA options, timestamped backup, concurrency lock (mkdir atomicity, retry, cleanup), verify content comparison, failure handling (download/extract/backup abort), config dir resolution order
          - packages/core/src/plugin/command/dag-flow.txt: two-scope (+builtin?) description consistency with the actual three-tier resolution

          Output:
          1. The full build-time data path: DAG_TEMPLATES_DIR → generate.ts → dagTemplatesData → build.ts define → binary constant
          2. What happens in dev when DAG_TEMPLATES_DIR is unset (both generate.ts behavior and the builtinTemplates() guard)
          3. The command registration pattern (how dag-flow and dag-template-update compare)
          4. The prompt file's lock/backup/verify/failure semantics line by line (M1/M2/M3 requirements: lock exists+retry+cleanup, backup-failure aborts overwrite, verify compares content not just list)
          5. Any inconsistency between dag-flow.txt's described scopes and the actual three-tier runtime
          6. Edge cases: empty template dir, non-yaml files in dir, name collision with project/global templates
    - id: explore-ci
      name: "Explore: release pipeline & tests"
      worker_type: explore
      depends_on: []
      prompt_template:
        inline: |
          TASK CONTEXT: 深度 review PR #167。diff 命令：git diff origin/dev...HEAD。变更集中在 release 流水线 + 测试。

          Explore:
          - .github/workflows/release-fork.yml (full): package-templates job (clone opencode-dag-config, nullglob guard, cp inside non-empty branch, tar packaging), Upload Templates Artifact, build-cli job (needs package-templates, download artifact, extract, DAG_TEMPLATES_DIR via GITHUB_ENV), Build CLI step env inheritance, release job (needs build-cli + package-templates, --target github.sha, download-artifact merge-multiple, dag-templates.tar.gz as release asset, SHA256SUMS)
          - packages/opencode/test/dag/dag-workflows.test.ts (full): what the 14 tests cover (resolve/list/shadowing/parse tolerance), what was deleted (change-review test) and why that is consistent
          - packages/opencode/test/dag/workflow-tool.test.ts: spot-check coverage of the workflow tool list/resolve behavior
          - packages/opencode/test/dag/dag-workflow-lock.test.ts: concurrency lock tests (what lock semantics are exercised)

          Output:
          1. Job graph: package-templates → build-cli → release, with needs chains and if conditions
          2. The env injection chain: artifact download → tar extraction → GITHUB_ENV DAG_TEMPLATES_DIR → Build CLI step (verify env inheritance without explicit env:)
          3. Empty-glob behavior: what happens when opencode-dag-config has no yaml (warning + empty archive vs fail)
          4. Release asset flow: which artifacts land in the release, --target github.sha semantics
          5. Test coverage inventory: what dag-workflows.test.ts tests, what the deleted change-review test verified, coverage of builtin scope (note: no injection in test env — how is builtin tested, if at all?)
          6. Any CI regression risk: job-level if conditions, checkout behavior on push vs workflow_dispatch
    # ---- Wave 2: Review (parallel, 5 dimensions) ----
    - id: review-architecture
      name: "Review: Architecture"
      worker_type: general
      depends_on: [explore-runtime, explore-build, explore-ci]
      prompt_template:
        inline: |
          你是 PR #167 的架构审查者。只读，禁止修改任何文件。工作目录：本仓库。

          审查目标：git diff origin/dev...HEAD 的全部变更（4 commits：676e0463e / 6ffc7a712 / 98e4c0624 / 2ee59d874）。先运行 git diff origin/dev...HEAD 获取完整变更，再结合上游探索结果（三个 explore 输出已提供）对照实际代码验证。

          设计背景：DAG 参考模板从主仓库抽离到独立配置仓库（LeWxDeX/opencode-dag-config）成为唯一权威源；/dag-template-update 命令做日常更新（zip 下载、预演分类、备份 QA）；每次 release 打包 dag-templates.tar.gz 资产 + 通过 DAG_TEMPLATES_DIR 构建注入把模板内嵌进二进制（builtin 三级 scope：project > global > builtin），封闭网络可用；主仓库不再 tracked 模板。

          审查准则：
          - 三级 scope 设计的合理性：项目 > 全局 > builtin 的优先级/遮蔽语义是否清晰且与文档一致（dag-flow.txt / workflow.md / README）
          - 单一权威源迁移是否完整：主仓库删除模板后，测试/文档/命令引用是否还有残留指向已删除的模板
          - 构建注入契约：DAG_TEMPLATES_DIR → generate.ts → define 注入的架构边界（与 OPENCODE_MODELS_DEV 先例对比）；dev 环境（未注入）与 release 环境（注入）的双模式是否正确
          - 发布流水线架构：资产打包 + 二进制内嵌双渠道的职责划分；package-templates job 与 build-cli 的耦合度是否合理
          - 模块边界：模板解析（workflows.ts）与命令层（workflow.ts）的职责切分；generate.ts 的数据注入是否保持了 generate 脚本的单一职责
          - 与仓库既有模式的一致性（AGENTS.md 扩展不变量：自包含 layer、服务注入等与本 PR 相关的部分）

          输出（强制格式）：
          1. findings: [{severity: CRITICAL|HIGH|MEDIUM|LOW, title, description, evidence: "file:line", recommendation}]
          2. unverified_claims: string[] —— 无法用 file:line 确认的断言
          3. summary: 2-3 句总体评估
    - id: review-logic
      name: "Review: Logic Correctness"
      worker_type: general
      depends_on: [explore-runtime, explore-build, explore-ci]
      prompt_template:
        inline: |
          你是 PR #167 的逻辑正确性审查者。只读，禁止修改任何文件。工作目录：本仓库。

          审查目标：git diff origin/dev...HEAD 全部变更。先运行 git diff origin/dev...HEAD，再对照实际代码。

          审查准则：
          - resolve() 三级回退：项目文件 → 全局文件 → builtin map；extension 循环与 scope 循环的嵌套顺序；describe()/parseMeta() 对坏 YAML 的容错
          - list() 去重/排序：project 遮蔽 global 遮蔽 builtin 的顺序一致性；builtin 条目 path（builtin://name）与文件条目的混合排序
          - readWorkflowSpec() builtin 分支：builtinName() 解析、content 缺失的报错、YAML 解析失败路径（workflowSpecParseError）是否与文件路径分支一致
          - builtinTemplates() 的 typeof 守卫：dev/test（无全局绑定）与 release（define 注入）两种环境的行为；`declare const` + typeof 守卫的 TS 语义
          - searchedScopes()：builtin 存在与否条件下的消息构造；searchPaths 可变性
          - generate.ts loadDagTemplatesData()：Glob 扫描、文件名 → 名称提取（.yaml/.yml）、路径拼接安全、JSON.stringify 输出；DAG_TEMPLATES_DIR 未设置时返回 "undefined" 字符串的语义
          - dag-template-update.txt 提示词逻辑（M1/M2/M3）：mkdir 锁的原子性/重试/清理、备份失败中止、verify 内容对比、下载/解压失败处理、配置目录解析顺序（OPENCODE_CONFIG_DIR / XDG_CONFIG_HOME）
          - release-fork.yml：nullglob + 空数组 cp 守卫、GITHUB_ENV 注入时机、--target github.sha、job needs 链
          - 边界条件：空 builtin map、builtin 被项目同名遮蔽、builtin 内容坏 YAML、DAG_TEMPLATES_DIR 指向空目录、模板名含特殊字符

          输出（强制格式）：
          1. findings: [{severity, title, description, evidence: "file:line", recommendation}]
          2. unverified_claims: string[]
          3. summary: 2-3 句总体评估
    - id: review-style
      name: "Review: Code Style & Conventions"
      worker_type: general
      depends_on: [explore-runtime, explore-build, explore-ci]
      prompt_template:
        inline: |
          你是 PR #167 的风格与惯例审查者。只读。工作目录：本仓库。

          审查目标：git diff origin/dev...HEAD 中所有 TS/TSX 与 YAML 变更。

          对照 AGENTS.md Style Guide：
          - 无多余解构（用点号访问）
          - 无 import 别名 / star import
          - const 优先于 let；三元/早退优先于重赋值
          - 无 else（早退）
          - 不预提取单次 helper（除非复用或命名真实概念）
          - Effect 生成器：服务绑定到命名变量
          - 非显而易见的约束加注释，明显赋值不加
          - 动态 import 用于启动敏感路径的重模块
          - 提示词 .txt 文件的可读性与结构一致性（dag-template-update.txt 与 dag-flow.txt 的风格对齐）

          也检查：命名一致性（builtinTemplates/builtinEntry/builtinName/isBuiltinPath）、类型标注纪律（依赖推断）、文件组织与导出模式（workflows.ts 顶层导出 + namespace 投影）。

          输出（强制格式）：
          1. findings: [{severity, title, description, evidence: "file:line", recommendation}]
          2. unverified_claims: string[]
          3. summary: 2-3 句总体评估
    - id: review-testability
      name: "Review: Testability & Coverage"
      worker_type: general
      depends_on: [explore-runtime, explore-build, explore-ci]
      prompt_template:
        inline: |
          你是 PR #167 的测试与覆盖审查者。只读。工作目录：本仓库。

          审查目标：git diff origin/dev...HEAD 的变更及对应测试。运行相关测试确认状态：
          - cd packages/opencode && bun test test/dag/dag-workflows.test.ts（应 14 pass 0 fail）
          - bun test test/dag/workflow-tool.test.ts（应 26 pass 0 fail）
          - bun run typecheck

          审查准则：
          - 已删测试的合理性：change-review 测试删除后，"主仓库不再 ship 模板"的行为是否仍有测试锚点？删除是否导致某行为失去回归保护？
          - builtin scope 的测试覆盖：测试环境无 OPENCODE_DAG_TEMPLATES 注入（typeof 守卫返回 {}），builtin 路径（resolve builtin 分支、readWorkflowSpec builtin 分支、list builtin 条目）实际**没有**被测试——这是覆盖缺口还是可接受？
          - 测试是否测试真实实现而非复制逻辑（AGENTS.md 测试纪律）
          - M1 并发锁是否有测试（dag-workflow-lock.test.ts 覆盖什么）
          - release-fork.yml 的 bash 逻辑（nullglob 守卫、GITHUB_ENV）是否有任何形式的验证（或只能靠静态审查）
          - generate.ts 的 DAG_TEMPLATES_DIR 加载是否有测试

          输出（强制格式）：
          1. findings: [{severity, title, description, evidence: "file:line 或 test 路径", recommendation}]
          2. unverified_claims: string[]
          3. coverage_gaps: [{path, untested_scenarios[]}]
          4. summary: 2-3 句总体评估
    - id: review-robustness
      name: "Review: Runtime Robustness"
      worker_type: general
      depends_on: [explore-runtime, explore-build, explore-ci]
      prompt_template:
        inline: |
          你是 PR #167 的运行时健壮性审查者。只读。工作目录：本仓库。

          审查目标：git diff origin/dev...HEAD 变更在真实环境下的失败模式。

          审查准则：
          - 封闭网络场景：二进制内嵌模板（builtin）离线可用性；无全局目录、无项目目录、无内置注入的"全空"场景行为链
          - 发布失败模式：opencode-dag-config clone 失败 / 空模板 / tar 失败 / artifact 上传失败 → 各 job 的失败传播（needs 链是否会导致 release 中止）
          - 环境变量注入：DAG_TEMPLATES_DIR 经 GITHUB_ENV 的跨步骤可见性；如果 build-cli 在某 runner 上无该变量，构建是否静默无内置模板（静默降级 vs 显式报错）
          - /dag-template-update 的并发：mkdir 锁在进程崩溃后残留（孤儿锁）的处理；锁重试次数；备份文件累积（.bak 文件是否清理）
          - 下载/解压失败：codeload 404/网络错误/坏 zip → 提示词是否强制原文报错且不伪造成功
          - 模板内容信任边界：内置模板与配置仓库同信任级（说明文档是否明确）；模板内容中的恶意 YAML 是否只影响元数据解析（parseMeta 容错）
          - 路径安全：Glob 扫描结果与 path.join 的路径穿越风险（模板名 ../ 等）

          输出（强制格式）：
          1. findings: [{severity, title, description, evidence: "file:line", recommendation}]
          2. unverified_claims: string[]
          3. failure_scenarios: [{scenario, impact, likelihood: HIGH|MEDIUM|LOW}]
          4. summary: 2-3 句总体评估
    # ---- Wave 3: Claim Verification ----
    - id: verify-claims
      name: "Verify Disputed Claims"
      worker_type: general
      depends_on: [review-architecture, review-logic, review-style, review-testability, review-robustness]
      required: true
      worker_config:
        timeout_ms: 1800000
      output_schema:
        type: object
        required: [verdict, verified_claims, disputed_findings_resolution, critical_findings_status, coverage_gaps, evidence_quality, prune_audit]
        properties:
          verdict:
            type: string
            enum: [VERIFIED, GAPS, BLOCKED]
          verified_claims: { type: array, items: { type: object } }
          disputed_findings_resolution: { type: array, items: { type: object } }
          critical_findings_status: { type: array, items: { type: object } }
          coverage_gaps: { type: array, items: { type: object } }
          evidence_quality: { type: string }
          prune_audit: { type: array, items: { type: object } }
      prompt_template:
        inline: |
          你是声明验证者（fresh-context）。只读，禁止修改任何文件。工作目录：本仓库。

          五个审查者对 PR #167（git diff origin/dev...HEAD）产出 findings 与 unverified_claims。你是对整个本地审查波的 fresh-context 复核。任务：检查每个 unverified/disputed/CRITICAL/HIGH 声明，并审计请求的范围/验收标准是否真的被覆盖。抽样检查 MEDIUM/LOW 声明，不要信任审查者自报。

          时间预算（30 分钟硬上限）：按下列优先级推进，不要在单个声明上耗尽预算：
          1. 所有 CRITICAL/HIGH —— 逐一对照 file:line 验证
          2. 所有审查者 unverified_claims —— 对照实际代码验证
          3. 审查者之间冲突的 findings
          4. 抽样 3-5 条 MEDIUM/LOW 声明
          5. PRUNE MANIFEST 审计（来自 explore-runtime 输出）
          6. 执行测试/类型检查证据：cd packages/opencode && bun test test/dag/dag-workflows.test.ts（应 14 pass）&& bun test test/dag/workflow-tool.test.ts（应 26 pass）&& bun run typecheck。除非审查者点名，否则不跑完整 dag-workflow-lock 套件。
          若时间不足，以 GAPS 判决结束并指名未验证的剩余部分——不要含糊带过。

          上游上下文包含 3 个探索 + 5 个审查者输出。提取：
          1. 每个审查者 unverified_claims 数组的所有条目
          2. 审查者之间冲突的 findings（severity 或结论矛盾）
          3. 所有 CRITICAL/HIGH —— 必须逐一验证
          4. 没有任何证据性输出的请求文件区域/集成/风险/审查准则
          5. explore-runtime 输出中的 PRUNE MANIFEST：每个 prune 必须有 prune_reason + replacement_coverage，缺失即审计失败

          对每条声明，读实际源码（file:line）判定：
          - CONFIRMED: 代码确如审查者所述（引用确切行）
          - REFUTED: 代码并非审查者所述（解释原因）
          - PARTIALLY_CONFIRMED: 方向正确但表述不精确
          - UNRESOLVABLE: 静态分析无法确定

          实际执行验证（允许运行命令，仅在审查者点名或时间允许时）：
          - cd packages/opencode && bun test test/dag/dag-workflows.test.ts 与 workflow-tool.test.ts 确认测试状态
          - DAG_TEMPLATES_DIR=<dir> bun script/generate.ts 验证加载路径（如果审查涉及）

          判决：
          - VERIFIED: 每个 material 范围/准则都被覆盖且无 material 声明悬而未决
          - GAPS: 有界的 fresh review 可关闭已命名的覆盖/证据缺口
          - BLOCKED: 无法获得所需证据或审查波不可审计

          通过 submit_result 提交结构化结果。coverage_gaps 必须命名缺失的范围、证据、以及 LOOP 时应新增的最小审查 lane。
    # ---- Wave 4: Arbitration ----
    - id: arbitrate
      name: "Arbiter: Final Verdict"
      worker_type: general
      depends_on: [verify-claims]
      required: true
      report_to_parent: true
      output_schema:
        type: object
        required: [verdict, reason, evidence, findings, loop_scope, stop_reason, next_action, prune_decisions]
        properties:
          verdict:
            type: string
            enum: [PASS, LOOP, BLOCKED]
          reason: { type: string }
          evidence:
            type: array
            items: { type: string }
          findings:
            type: array
            items:
              type: object
              required: [severity, title, evidence, status]
              properties:
                severity:
                  type: string
                  enum: [CRITICAL, HIGH, MEDIUM, LOW]
                title:
                  type: string
                description:
                  type: string
                evidence:
                  type: string
                status:
                  type: string
                  enum: [CONFIRMED, REFUTED, PARTIALLY_CONFIRMED]
                recommendation:
                  type: string
          loop_scope:
            type: array
            items:
              type: string
          stop_reason:
            type: string
            enum: [goal_met, correction_required, evidence_missing, no_progress, round_cap, budget_cap]
          next_action:
            type: string
            enum: [finalize, replan, stop]
          prune_decisions:
            type: array
            items:
              type: object
              required: [node, prune_reason, replacement_coverage]
              properties:
                node: { type: string }
                prune_reason: { type: string }
                replacement_coverage: { type: string }
      prompt_template:
        inline: |
          你是 PR #167 深度 review 的仲裁者。你只对已验证的证据下结论。

          验证波已检查所有 unverified/disputed 声明，其输出是你的主要证据基础。5 个审查者输出作为上下文。

          你的职责：
          1. 对每个 CONFIRMED finding 评估真实 severity（审查者可能高估/低估）
          2. REFUTED 声明直接丢弃，不进 findings
          3. PARTIALLY_CONFIRMED 以修正后的描述纳入
          4. 去重描述同一根因的 findings
          5. 按影响排序
          6. 给出 fail-closed 门禁判决：
             - PASS: 无未解决的 material finding；范围与证据覆盖完整
             - LOOP: 有界定向审查可解决特定遗漏或争议
             - BLOCKED: 证据不足、关键矛盾未解决、进度停滞、或图上限耗尽
          7. LOOP 必须命名最小新审查/验证范围。绝不意味着重跑整个图或重启已完成节点。
          8. 审计每个父声明的 prune：缺失 prune_reason 或 replacement_coverage 禁止 PASS。
          9. 陈述 reason、evidence、stop_reason 与确切 next_action。裸结论不是有效判决。

          父会话处置契约：PASS → finalize；LOOP → pause/replan/resume 全新定向审查+验证+仲裁节点；BLOCKED → stop。父会话不得把 LOOP 重新解释为建议性接受。

          通过 submit_result 提交结构化判决。
    # ---- Continuation ----
    - id: deep-dive
      name: "Plan the bounded fresh review loop"
      worker_type: general
      depends_on: [arbitrate]
      condition: 'arbitrate.output.verdict == "LOOP"'
      required: true
      report_to_parent: true
      prompt_template:
        inline: |
          仲裁者要求 LOOP。为新的定向审查波产出最小 replan fragment 提案：只包含缺失或有争议的范围，分配新节点 ID，保持真实工件依赖，新增 fresh 验证者与新仲裁者，并保持在图上限内。只读：不要修代码。

          返回 loop 原因、新节点、依赖、每个节点必须收集的证据、验收条件与 stop reason。父会话必须 pause → replan → resume；绝不重启已完成节点或创建环。
    - id: finalize-review
      name: "Publish the accepted deep-review report"
      worker_type: general
      depends_on: [arbitrate]
      condition: 'arbitrate.output.verdict == "PASS"'
      required: true
      report_to_parent: true
      prompt_template:
        inline: |
          发布最终证据驱动的 review 报告：范围覆盖、确认的 findings、丢弃/反驳的声明、验证证据、残余低风险项、最终 PASS 理由。不引入上游未验证的新 findings 或声明。
