# ============================================================================
# Runner smoke
# ----------------------------------------------------------------------------
# Purpose : Dispatch-only probe for the repository-scoped self-hosted runners
#           on 192.168.34.92 (Ubuntu) and 192.168.34.93 (Windows)
# Trigger : Manual `workflow_dispatch` with a required linux/windows choice
# Jobs    : exactly one platform job per dispatch, standard self-hosted labels
# Notes   : no checkout, no third-party actions, no secrets and no token; each
#           job is bounded to 10 minutes and reports runner/account identity
#           and installed tool versions only.
# ============================================================================

name: Runner smoke

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to exercise on its self-hosted runner
        required: true
        type: choice
        options:
          - linux
          - windows

permissions:
  contents: read

concurrency:
  group: runner-smoke-${{ inputs.platform }}
  cancel-in-progress: false

jobs:
  smoke-linux:
    name: Runner smoke (linux)
    if: inputs.platform == 'linux'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Report runner identity and tooling
        shell: bash
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
          RUN_ID: ${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          echo "platform=linux"
          echo "runner_name=${RUNNER_NAME:-unknown}"
          echo "runner_environment=${RUNNER_ENVIRONMENT:-unknown}"
          echo "runner_os=${RUNNER_OS:-unknown}"
          echo "runner_arch=${RUNNER_ARCH:-unknown}"
          echo "workflow_ref=${WORKFLOW_REF}"
          echo "run_id=${RUN_ID}"
          echo "commit=${COMMIT_SHA}"
          echo "hostname=$(hostname)"
          echo "whoami=$(whoami)"
          echo "identity=$(id -un):$(id -gn) uid=$(id -u) gid=$(id -g)"
          sed -n '1,4p' /etc/os-release
          uname -a
          for tool in bash git node python3; do
            if command -v "$tool" >/dev/null 2>&1; then
              tool_path="$(command -v "$tool")"
              tool_version="$("$tool" --version 2>&1 | head -n 1)"
              echo "tool.$tool=$tool_path :: $tool_version"
            else
              echo "tool.$tool=missing"
            fi
          done

  smoke-windows:
    name: Runner smoke (windows)
    if: inputs.platform == 'windows'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Report runner identity and tooling
        shell: pwsh
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
          RUN_ID: ${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          Write-Output "platform=windows"
          Write-Output "runner_name=$env:RUNNER_NAME"
          Write-Output "runner_environment=$env:RUNNER_ENVIRONMENT"
          Write-Output "runner_os=$env:RUNNER_OS"
          Write-Output "runner_arch=$env:RUNNER_ARCH"
          Write-Output "workflow_ref=$env:WORKFLOW_REF"
          Write-Output "run_id=$env:RUN_ID"
          Write-Output "commit=$env:COMMIT_SHA"
          Write-Output "hostname=$env:COMPUTERNAME"
          Write-Output "whoami=$(whoami)"
          Write-Output "os_version=$([System.Environment]::OSVersion.VersionString)"
          Write-Output "pwsh_version=$($PSVersionTable.PSVersion)"
          foreach ($tool in @('git', 'node', 'python')) {
            $resolved = Get-Command $tool -ErrorAction SilentlyContinue
            if ($resolved) {
              Write-Output "tool.$tool=$($resolved.Source)"
            } else {
              Write-Output "tool.$tool=missing"
            }
          }
