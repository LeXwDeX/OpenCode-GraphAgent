name: Nix verification

on:
  pull_request:
    paths:
      - flake.nix
      - flake.lock
      - nix/**
      - package.json
      - bun.lock
      - .node-version
      - config_assistant/go.mod
      - packages/desktop/package.json
      - .github/workflows/nix-verify.yml
  workflow_dispatch:
    inputs:
      regenerate_hashes:
        description: Measure and apply native hashes before building; return artifacts for review
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nix-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-build:
    name: Nix (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: aarch64-darwin
            runner: macos-15
          - system: x86_64-darwin
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.0/install
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Verify native toolchain, dependency hash and both packages
        shell: bash
        env:
          NIX_SYSTEM: ${{ matrix.system }}
          REGENERATE_HASHES: ${{ inputs.regenerate_hashes || false }}
        run: |
          args=(--system "$NIX_SYSTEM")
          if [[ "$REGENERATE_HASHES" == true ]]; then args+=(--apply); fi
          python3 nix/scripts/verify_build.py "${args[@]}"
      - name: Preserve measured hashes and native build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nix-${{ matrix.system }}-${{ github.sha }}
          path: nix-evidence/
          if-no-files-found: error
