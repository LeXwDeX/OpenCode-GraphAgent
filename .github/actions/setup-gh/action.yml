name: Setup pinned GitHub CLI
description: Install a verified GitHub CLI archive into job-local storage

runs:
  using: composite
  steps:
    - name: Install verified GitHub CLI
      shell: bash
      env:
        GH_CLI_VERSION: "2.101.0"
        GH_CLI_LINUX_AMD64_SHA256: 9bca2d1c16825f109907a23307628a2f0698fbf99662b73a5cf0b020293072b8
        GH_CLI_WINDOWS_AMD64_SHA256: bc6c814367b193cd8e713611d61e36013c0ef843b8f516458fe3eda039192794
        GH_CLI_DOWNLOAD_BASE_URL: https://github.com/cli/cli/releases/download/v2.101.0
      run: |
        action_path="$GITHUB_ACTION_PATH"
        if [ "$RUNNER_OS" = "Windows" ] && command -v cygpath >/dev/null 2>&1; then
          action_path="$(cygpath -u "$action_path")"
        fi
        bash "$action_path/setup.sh"
